[package]
name = "jagent-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "napi shell for j-agent: the ONLY cross-language seam (architecture.md §2.3)"

[lib]
crate-type = ["cdylib"]

[features]
# Linux 构建用 --no-default-features 禁用（wgpu 图像回读未落地，gpuix 上游
# CI 同样禁）；其余平台默认启用（TestGpuixRenderer 供 e2e 使用）。
default = ["test-support"]
test-support = ["gpuix-native/test-support"]

[dependencies]
gpuix-native = { path = "../../.refs/gpuix/packages/native", default-features = false }
jagent-terminal = { path = "../../crates/jagent-terminal" }
gpui = { path = "../../.refs/gpuix/zed/crates/gpui", default-features = false, features = [
    "font-kit",
    "wayland",
    "x11",
] }

napi = { version = "3", default-features = false, features = [
    "napi8",
    "serde-json",
] }
napi-derive = "3"
serde = "1"
serde_json = "1"
anyhow = "1"
# 进程外崩溃报告（docs/error-management.md 方案 C；Zed crashes 同源技术）：
# crash-handler 安装 signal/SEH 处理器，minidumper 提供 client/server IPC。
# 同仓库同波发布配套版（crates.io 联网核实：均要求 crash-context ^0.8）。
crash-handler = "0.8.0"
minidumper = "0.11.0"

# Canvas 2D bitmap-first 路线（docs/canvas-rust-raster-research.md §8）：
# vello_cpu 光栅 → 持久 Pixmap → window.paint_image。cosmic-text 提供
# shaping/layout（GPUI Linux 文本同款栈，锁文件已有）；peniko feature 让
# Font::as_peniko() 产出与 vello glyph_run 相同的 FontData 类型。image 的
# Frame 是 gpui RenderImage 的包装类型，版本必须与 gpui 依赖统一（锁
# 0.25.10）。版本经 crates.io 联网核实（2026-09-20）。
vello_cpu = "0.2.0"
cosmic-text = { version = "0.19.0", features = ["peniko"] }
image = "0.25.10"

# Match the pinned zed fork so we can set NSApplication.appearance before
# the first window exists (gpui App is not live yet).
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "0.2"

# Windows toast (notify.rs). Version aligned with the pinned zed fork's
# workspace (0.61) — cargo merges features across the tree, no conflict.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[build-dependencies]
napi-build = "2"
