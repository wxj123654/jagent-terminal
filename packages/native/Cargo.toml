[package]
name = "jagent-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "napi shell for j-agent: the ONLY cross-language seam (architecture.md §2.3)"

[lib]
crate-type = ["cdylib"]

[dependencies]
# GPUUIX pinned checkout — same rev as jagent-terminal's gpui/gpui_platform,
# same default features (test-support) so TestGpuixRenderer stays available.
gpuix-native = { path = "../../.refs/gpuix/packages/native" }
jagent-terminal = { path = "../../crates/jagent-terminal" }
gpui = { path = "../../.refs/gpuix/zed/crates/gpui", default-features = false, features = [
    "font-kit",
] }

napi = { version = "3", default-features = false, features = [
    "napi8",
    "serde-json",
] }
napi-derive = "3"
serde = "1"
serde_json = "1"
anyhow = "1"

# Windows toast (notify.rs). Version aligned with the pinned zed fork's
# workspace (0.61) — cargo merges features across the tree, no conflict.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[build-dependencies]
napi-build = "2"
