<div class="frame"><canvas id="art"></canvas></div>
<p class="label"><b>MONA LISA</b><span>after Leonardo da Vinci · 纯 JavaScript + Canvas 2D 逐笔绘制（0 图片 / 0 像素数据 / 0 外部资源）</span></p>
<script>
'use strict';
/* ============================================================
 * 蒙娜丽莎 —— 100% 程序化 Canvas 绘制
 * 核心手法：
 *  1. sfumato（晕涂法）：全部明暗用径向/线性渐变柔边叠加，
 *     再以低分辨率绘制 + 高倍平滑放大，让边缘如烟似雾；
 *  2. 微笑 = 嘴角上翘线 + 角落晕影 + 面颊隆起高光的组合；
 *  3. 做旧：种子随机龟裂缝 + 清漆黄变 + 暗角 + 杨木纹理。
 * ============================================================ */

const SW = 500, SH = 730;          // 小画布（逻辑分辨率）
const OUT_SCALE = 2;               // 放大 2x → 1000×1460

const art = document.getElementById('art');
art.width = SW * OUT_SCALE; art.height = SH * OUT_SCALE;
const out = art.getContext('2d');
out.imageSmoothingEnabled = true; out.imageSmoothingQuality = 'high';

const off = document.createElement('canvas');
off.width = SW; off.height = SH;
const g = off.getContext('2d');

/* ---------- 确定性随机（每次打开画面一致） ---------- */
let seed = 20250905;
function rnd(){ seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function rr(a, b){ return a + (b - a) * rnd(); }

/* ---------- 工具 ---------- */
function lg(x0,y0,x1,y1,stops){
  const gr = g.createLinearGradient(x0,y0,x1,y1);
  for(const [p,c] of stops) gr.addColorStop(p,c);
  return gr;
}
function rg(x,y,r0,r1,stops){
  const gr = g.createRadialGradient(x,y,r0,x,y,r1);
  for(const [p,c] of stops) gr.addColorStop(p,c);
  return gr;
}
/* 柔边椭圆 —— sfumato 的基本笔触：中心实、边缘化入空气 */
function soft(x, y, rx, ry, rgb, a){
  g.save(); g.translate(x, y); g.scale(rx, ry);
  const gr = g.createRadialGradient(0,0,0, 0,0,1);
  gr.addColorStop(0, `rgba(${rgb},${a})`);
  gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr;
  g.beginPath(); g.arc(0,0,1,0,Math.PI*2); g.fill();
  g.restore();
}

/* ============================================================
 * 1. 背景：托斯卡纳雾气山水
 * ============================================================ */
(function landscape(){
  /* 天空：冷蓝雾气 → 地平线暖雾（左右地平线故意略有高低差） */
  g.fillStyle = lg(0,0,0,320,[[0,'#4f6f68'],[0.45,'#7e9784'],[0.8,'#a8b39a'],[1,'#c2c2a2']]);
  g.fillRect(0,0,SW,340);

  /* 左侧远山（冰雪冷调，更远更高） */
  g.fillStyle = 'rgba(150,168,155,0.85)';
  g.beginPath(); g.moveTo(0,232);
  g.bezierCurveTo(22,196,40,214,58,188); g.bezierCurveTo(74,206,92,178,112,204);
  g.bezierCurveTo(130,186,148,214,166,240); g.lineTo(0,252); g.closePath(); g.fill();

  g.fillStyle = '#7d948a';
  g.beginPath(); g.moveTo(0,248);
  g.bezierCurveTo(24,214,46,232,66,204); g.bezierCurveTo(84,224,104,196,124,222);
  g.bezierCurveTo(142,206,158,232,172,258); g.lineTo(0,268); g.closePath(); g.fill();

  /* 右侧崖壁（暖褐，更近更高——与左侧形成远近视差） */
  g.fillStyle = '#75775d';
  g.beginPath(); g.moveTo(336,262);
  g.bezierCurveTo(348,216,360,228,372,178); g.bezierCurveTo(382,196,392,158,406,182);
  g.bezierCurveTo(418,150,434,196,452,178); g.bezierCurveTo(466,160,482,206,500,196);
  g.lineTo(500,272); g.lineTo(336,272); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(190,175,130,0.28)'; g.lineWidth = 2; g.lineCap = 'round';
  [[372,182,366,236],[406,186,404,240],[434,190,444,244]].forEach(([x0,y0,x1,y1])=>{
    g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke();
  });

  /* 地平线雾带 */
  g.fillStyle = lg(0,225,0,300,[[0,'rgba(212,214,186,0)'],[0.5,'rgba(212,214,186,0.5)'],[1,'rgba(205,208,180,0.15)']]);
  g.fillRect(120,225,SW-120,80);

  /* 右侧湖水 */
  g.fillStyle = lg(345,270,345,380,[[0,'#9fae91'],[0.6,'#8b9a7c'],[1,'#6f7f60']]);
  g.beginPath(); g.moveTo(500,268); g.lineTo(500,400); g.lineTo(352,400); g.lineTo(348,280);
  g.closePath(); g.fill();
  for(let i=0;i<14;i++){
    const y = 282 + i*8;
    g.fillStyle = `rgba(214,218,186,${0.05 + 0.05*Math.abs(Math.sin(i*1.7))})`;
    g.fillRect(352 + rr(0,40), y, rr(40,140), 2.4);
  }

  /* Ponte Buriano 石拱桥 */
  g.fillStyle = '#3e3a2b';
  g.fillRect(388,300,74,12);
  for(let i=0;i<4;i++){
    const x = 395 + i*17;
    g.fillStyle = '#98a686';
    g.beginPath(); g.arc(x,312,4.6,Math.PI,Math.PI*2); g.closePath(); g.fill();
  }
  g.strokeStyle = 'rgba(222,222,192,0.5)'; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(386,300); g.lineTo(464,300); g.stroke();

  /* 左侧蜿蜒河流（S 形亮带，达芬奇招牌蛇形曲线） */
  g.strokeStyle = 'rgba(196,203,170,0.75)'; g.lineCap = 'round';
  g.lineWidth = 8;
  g.beginPath(); g.moveTo(6,276);
  g.quadraticCurveTo(26,300,6,330); g.quadraticCurveTo(30,360,12,392);
  g.stroke();
  g.lineWidth = 13;
  g.beginPath(); g.moveTo(10,282);
  g.quadraticCurveTo(34,308,12,338); g.quadraticCurveTo(38,368,14,396);
  g.stroke();

  /* 左下蜿蜒小路 */
  g.strokeStyle = 'rgba(180,168,120,0.55)'; g.lineWidth = 9;
  g.beginPath(); g.moveTo(96,318);
  g.quadraticCurveTo(70,352,108,376); g.quadraticCurveTo(140,398,120,430);
  g.stroke();

  /* 前景两岸：压暗下半幅 */
  g.fillStyle = lg(0,340,0,730,[[0,'#4b523c'],[0.45,'#39402f'],[1,'#232919']]);
  g.fillRect(0,330,SW,SH-330);
  g.fillStyle = 'rgba(88,96,64,0.5)';
  g.beginPath(); g.moveTo(0,388);
  g.bezierCurveTo(50,362,110,392,168,420); g.lineTo(168,470); g.lineTo(0,470); g.closePath(); g.fill();
  g.fillStyle = 'rgba(80,86,58,0.55)';
  g.beginPath(); g.moveTo(500,372);
  g.bezierCurveTo(440,398,396,392,352,428); g.lineTo(352,470); g.lineTo(500,470); g.closePath(); g.fill();
  /* 底角树影 */
  soft(30,700,90,60,'18,22,12',0.5);
  soft(470,690,80,60,'20,24,14',0.5);
})();

/* ============================================================
 * 2. 身体：金字塔构图（深色裙装整体）
 * ============================================================ */
(function body(){
  g.fillStyle = rg(250,430,60,340,[[0,'#37301f'],[0.55,'#241f14'],[1,'#12100a']]);
  g.beginPath();
  g.moveTo(206,318);
  g.bezierCurveTo(186,326,172,340,164,360);        /* 左肩外侧 */
  g.bezierCurveTo(148,420,140,472,138,522);        /* 左臂外缘 */
  g.bezierCurveTo(136,566,150,606,176,634);        /* 左肘 */
  g.bezierCurveTo(204,664,236,696,252,730);
  g.lineTo(474,730);
  g.bezierCurveTo(468,664,442,606,414,566);        /* 右侧外缘 */
  g.bezierCurveTo(394,532,372,478,360,430);
  g.bezierCurveTo(350,384,330,342,296,318);        /* 右肩 */
  g.bezierCurveTo(280,350,264,366,250,372);        /* 领口 */
  g.bezierCurveTo(236,366,222,350,206,318);
  g.closePath(); g.fill();

  /* 胸前柔和的竖向衣褶 */
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 4; g.lineCap = 'round';
  const folds = [
    [214,384,206,470,196,560,'#3f3824',2.6,0.5],
    [232,392,228,480,222,580,'#443c26',2.2,0.45],
    [250,398,250,492,248,600,'#3a3420',2.4,0.4],
    [268,392,272,480,278,580,'#423a24',2.2,0.45],
    [286,384,294,470,304,560,'#3f3824',2.6,0.5],
    [178,372,166,460,158,560,'#2c2718',3,0.5],
    [322,372,336,460,348,560,'#2c2718',3,0.5],
    [244,420,240,540,236,660,'#4a412a',2,0.3],
    [258,420,262,540,266,660,'#332d1c',2,0.35],
  ];
  for(const [x0,y0,cx,cy,x1,y1,col,w,a] of folds){
    g.strokeStyle = col; g.globalAlpha = a; g.lineWidth = w;
    g.beginPath(); g.moveTo(x0,y0); g.quadraticCurveTo(cx,cy,x1,y1); g.stroke();
  }
  g.restore(); g.globalAlpha = 1;

  /* 扶手（右下，她左肘所倚） */
  g.fillStyle = lg(0,668,0,730,[[0,'#2a2013'],[1,'#171208']]);
  g.beginPath(); g.moveTo(330,642);
  g.bezierCurveTo(396,650,452,660,500,662);
  g.lineTo(500,730); g.lineTo(300,730); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(150,120,70,0.35)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(332,644);
  g.bezierCurveTo(398,652,452,662,498,664); g.stroke();
})();

/* ============================================================
 * 3. 颈与胸口
 * ============================================================ */
(function neckChest(){
  /* 颈后暗色（补在头发与颈之间的空隙，避免透出背景） */
  g.fillStyle = '#1d1410';
  g.fillRect(222,266,56,54);

  /* 颈 */
  g.fillStyle = lg(232,262,268,320,[[0,'#d3a67b'],[1,'#b9895f']]);
  g.beginPath(); g.moveTo(231,256);
  g.bezierCurveTo(236,282,236,300,233,318);
  g.lineTo(267,318);
  g.bezierCurveTo(264,300,264,282,269,256);
  g.closePath(); g.fill();

  /* 胸口（领口以上皮肤） */
  g.beginPath(); g.moveTo(206,318);
  g.bezierCurveTo(222,352,236,368,250,372);
  g.bezierCurveTo(264,368,278,352,294,318);
  g.bezierCurveTo(284,306,272,300,262,298);
  g.lineTo(238,298);
  g.bezierCurveTo(228,300,216,306,206,318);
  g.closePath();
  g.fillStyle = rg(250,320,20,70,[[0,'#e2b98e'],[0.7,'#c99b6f'],[1,'#a87c55']]);
  g.fill();

  /* 明暗：下颌投影、锁骨提示、胸骨浅影、高光 */
  soft(250,296,20,9,'120,72,45',0.5);
  soft(250,318,3,16,'140,90,58',0.25);
  soft(250,332,26,18,'235,190,140',0.25);
  g.strokeStyle = 'rgba(150,96,60,0.30)'; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(224,314); g.quadraticCurveTo(232,320,240,322); g.stroke();
  g.beginPath(); g.moveTo(276,314); g.quadraticCurveTo(268,320,260,322); g.stroke();
})();

/* ============================================================
 * 4. 头发（大块暗色底 + 发丝；脸画在其上）
 * ============================================================ */
(function hair(){
  g.fillStyle = lg(250,130,250,450,[[0,'#33241a'],[0.5,'#241811'],[1,'#191009']]);
  g.beginPath(); g.moveTo(250,134);
  g.bezierCurveTo(206,136,191,168,191,206);
  g.bezierCurveTo(190,252,180,278,172,312);
  g.bezierCurveTo(164,356,158,400,160,446);
  g.bezierCurveTo(150,456,152,468,162,470);
  g.bezierCurveTo(178,474,196,466,204,452);
  g.bezierCurveTo(208,392,214,344,222,306);
  g.bezierCurveTo(228,272,230,240,230,212);
  g.lineTo(270,212);
  g.bezierCurveTo(270,240,272,272,278,306);
  g.bezierCurveTo(286,344,292,392,296,452);
  g.bezierCurveTo(304,466,322,474,338,470);
  g.bezierCurveTo(348,468,350,456,340,446);
  g.bezierCurveTo(342,400,336,356,328,312);
  g.bezierCurveTo(320,278,310,252,309,206);
  g.bezierCurveTo(309,168,294,136,250,134);
  g.closePath(); g.fill();
})();

/* ============================================================
 * 5. 脸 —— 全画的灵魂
 * ============================================================ */
(function face(){
  /* 脸型：宽额、渐收的下颌 */
  g.beginPath(); g.moveTo(250,145);
  g.bezierCurveTo(216,145,202,170,202,198);
  g.bezierCurveTo(202,230,212,254,230,272);
  g.bezierCurveTo(240,281,260,281,270,272);
  g.bezierCurveTo(288,254,298,230,298,198);
  g.bezierCurveTo(298,170,284,145,250,145);
  g.closePath();
  g.fillStyle = rg(244,196,12,72,[[0,'#eec99f'],[0.45,'#dcb083'],[0.8,'#c1926a'],[1,'#a37753']]);
  g.fill();

  /* 大关系：光从观者左上方来 → 右侧没入阴影 */
  soft(248,178,34,20,'242,208,162',0.28);      /* 额头高光 */
  soft(250,168,26,8,'248,216,172',0.20);
  soft(238,226,14,10,'238,196,150',0.15);      /* 左颊受光 */
  soft(282,228,10,12,'140,92,56',0.18);        /* 右颊暗部 */
  soft(226,236,8,6,'196,120,88',0.10);         /* 微微血色 */
  soft(274,236,8,6,'196,120,88',0.12);

  /* 发际线：高额头（文艺复兴时尚）——一排深色晕点 */
  for(let i=0;i<=8;i++){
    const t = i/8, x = 210 + t*80, y = 160 - Math.sin(t*Math.PI)*10;
    soft(x,y,7,5,'64,42,26',0.5);
  }

  /* ---- 眼睛（无眉！只有极淡的眉骨投影） ---- */
  function eye(cx){
    soft(cx,203,17,10,'112,74,46',0.35);       /* 眼窝阴影 */
    g.fillStyle = '#cfc0a6';                   /* 眼白（灰调） */
    g.beginPath(); g.moveTo(cx-10,202);
    g.bezierCurveTo(cx-5,195.5,cx+5,195.5,cx+10,202);
    g.bezierCurveTo(cx+5,208.5,cx-5,208.5,cx-10,202);
    g.closePath(); g.fill();
    g.fillStyle = '#46351f';                   /* 虹膜：深褐 */
    g.beginPath(); g.arc(cx+0.8,201.5,4.6,0,Math.PI*2); g.fill();
    g.fillStyle = '#1a120a';                   /* 瞳孔 */
    g.beginPath(); g.arc(cx+0.8,201.5,2.1,0,Math.PI*2); g.fill();
    g.strokeStyle = 'rgba(30,20,12,0.55)'; g.lineWidth = 0.8;
    g.beginPath(); g.arc(cx+0.8,201.5,4.6,0,Math.PI*2); g.stroke();
    g.strokeStyle = '#3b291a'; g.lineWidth = 1.6; g.lineCap = 'round';
    g.beginPath(); g.moveTo(cx-9,201.5);       /* 上睑线 */
    g.bezierCurveTo(cx-5,195,cx+5,195,cx+9,201.5); g.stroke();
    g.strokeStyle = 'rgba(120,80,50,0.45)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(cx-8,198.5);       /* 双眼皮褶 */
    g.bezierCurveTo(cx-4,193.5,cx+4,193.5,cx+8,198.5); g.stroke();
    g.strokeStyle = 'rgba(150,100,64,0.35)';
    g.beginPath(); g.moveTo(cx-8,204.5);       /* 下睑 */
    g.bezierCurveTo(cx-4,207.5,cx+4,207.5,cx+8,204.5); g.stroke();
  }
  eye(231); eye(269);
  soft(231,191,15,5,'110,72,45',0.22);         /* 眉骨（几乎无眉） */
  soft(269,191,15,5,'110,72,45',0.22);

  /* ---- 鼻：长直，全靠明暗 ---- */
  soft(257,220,7,17,'118,76,46',0.30);         /* 鼻梁右侧阴影 */
  soft(246,212,6,16,'244,216,172',0.22);       /* 左侧受光 */
  soft(253,235,8,6,'130,84,50',0.32);          /* 鼻头右转面 */
  soft(249,230,4,3,'246,220,178',0.30);        /* 鼻尖高光 */
  soft(241,238,3,2.2,'88,52,32',0.5);          /* 鼻孔 */
  soft(260,238,3.4,2.4,'88,52,32',0.45);
  soft(250,243,9,3.5,'125,78,46',0.28);        /* 鼻底投影 */

  /* ---- 嘴：神秘微笑 ---- */
  g.strokeStyle = '#6e4232'; g.lineWidth = 1.4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(231,254);            /* 唇缝：两端微微上翘 */
  g.bezierCurveTo(238,257.5,244,258.5,250,258);
  g.bezierCurveTo(256,258.5,262,257.5,269,254);
  g.stroke();
  g.fillStyle = '#9c6049';                     /* 上唇（薄） */
  g.beginPath(); g.moveTo(231,254);
  g.bezierCurveTo(236,250,242,252.5,246,253);
  g.bezierCurveTo(248,252,252,252,254,253);
  g.bezierCurveTo(258,252.5,264,250,269,254);
  g.bezierCurveTo(263,257,237,257,231,254);
  g.closePath(); g.fill();
  g.fillStyle = '#b37157';                     /* 下唇（丰） */
  g.beginPath(); g.moveTo(233,255.5);
  g.bezierCurveTo(240,264,260,264,267,255.5);
  g.bezierCurveTo(260,261,240,261,233,255.5);
  g.closePath(); g.fill();
  soft(250,261,8,2.6,'236,182,150',0.35);      /* 下唇高光 */
  soft(250,267,10,3.6,'128,80,48',0.32);       /* 唇下阴影 */
  soft(250,273,9,4,'240,205,164',0.28);        /* 下巴球面高光 */
  /* 微笑的秘密：嘴角晕影 + 面颊隆起，让笑意"藏在暗部" */
  soft(230,252.5,5,4,'104,56,36',0.5);
  soft(270,252.5,5,4,'104,56,36',0.5);
  soft(224,247,7,5,'242,200,158',0.30);
  soft(276,247,7,5,'242,200,158',0.30);
  soft(230,259,4,4,'126,76,46',0.35);
  soft(270,259,4,4,'126,76,46',0.35);

  /* ---- 轮廓晕涂：边缘没入空气 ---- */
  [[298,200],[295,224],[288,246],[278,264],[270,274]].forEach(([x,y])=>soft(x,y,6,10,'118,76,46',0.22));
  [[203,206],[202,230],[208,252],[218,268]].forEach(([x,y])=>soft(x,y,5,9,'130,86,52',0.14));
  soft(250,146,40,10,'118,76,46',0.18);
  /* 下颌与颈的转折 */
  soft(250,286,16,6,'126,78,48',0.35);
})();

/* ============================================================
 * 6. 发丝、鬓角与黑纱
 * ============================================================ */
(function strands(){
  const hairCols = ['#1c130c','#2b1c10','#3d2814','#52371d','#6b4a28'];
  function strand(x0,y0,cx,cy,x1,y1,w,a,col){
    g.strokeStyle = col; g.lineWidth = w; g.globalAlpha = a; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x0,y0); g.quadraticCurveTo(cx,cy,x1,y1); g.stroke();
    g.globalAlpha = 1;
  }
  for(let i=0;i<46;i++) strand(                               /* 左侧长发流 */
    246-rr(0,10), 140+rr(0,26), rr(178,208), rr(190,240),
    rr(158,200), rr(280,455), rr(1,2.6), rr(0.25,0.6),
    hairCols[Math.floor(rnd()*hairCols.length)]);
  for(let i=0;i<46;i++) strand(                               /* 右侧 */
    254+rr(0,10), 140+rr(0,26), rr(292,322), rr(190,240),
    rr(300,342), rr(280,455), rr(1,2.6), rr(0.25,0.6),
    hairCols[Math.floor(rnd()*hairCols.length)]);
  for(let i=0;i<16;i++){                                      /* 鬓角小绺 */
    const s = rnd()<0.5 ? -1 : 1;
    strand(250+s*rr(36,50), rr(150,185), 250+s*rr(40,52), rr(200,230),
           250+s*rr(42,56), rr(240,280), rr(1,2.2), rr(0.3,0.55), '#241811');
  }
  soft(212,270,15,80,'86,60,32',0.30);                        /* 大体积光 */
  soft(288,270,15,80,'86,60,32',0.28);
  soft(250,150,40,18,'90,64,34',0.25);

  /* 黑纱：整体半透明罩染 + 额前纱缘 */
  g.fillStyle = 'rgba(12,10,8,0.20)';
  g.beginPath(); g.moveTo(250,134);
  g.bezierCurveTo(206,136,191,168,191,206);
  g.bezierCurveTo(190,252,180,278,172,312);
  g.bezierCurveTo(164,356,158,400,160,446);
  g.lineTo(162,470); g.bezierCurveTo(178,474,196,466,204,452);
  g.bezierCurveTo(208,392,214,344,222,306);
  g.bezierCurveTo(228,272,230,240,230,212);
  g.lineTo(270,212);
  g.bezierCurveTo(270,240,272,272,278,306);
  g.bezierCurveTo(286,344,292,392,296,452);
  g.bezierCurveTo(304,466,322,474,338,470);
  g.lineTo(340,446);
  g.bezierCurveTo(342,400,336,356,328,312);
  g.bezierCurveTo(320,278,310,252,309,206);
  g.bezierCurveTo(309,168,294,136,250,134);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(30,24,18,0.5)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(206,158); g.quadraticCurveTo(250,142,294,158); g.stroke();
  g.strokeStyle = 'rgba(30,24,18,0.30)'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(302,200); g.quadraticCurveTo(310,290,304,380); g.stroke();
  soft(250,132,44,10,'220,210,190',0.06);                     /* 纱面微光 */
})();

/* ============================================================
 * 7. 领口金线刺绣
 * ============================================================ */
(function embroidery(){
  const nl = [[207,326],[213,339],[221,351],[230,360],[240,367],[250,370],
              [260,367],[270,360],[279,351],[287,339],[293,326]];
  function goldBand(off){
    g.strokeStyle = 'rgba(158,124,58,0.8)'; g.lineWidth = 1.3; g.lineCap = 'round';
    g.beginPath();
    nl.forEach(([x,y],i)=>{
      const yy = y + off*(1 + 0.35*Math.sin((x-250)/45));
      i ? g.lineTo(x,yy) : g.moveTo(x,yy);
    });
    g.stroke();
  }
  goldBand(0); goldBand(13);
  nl.forEach(([x,y],i)=>{                                     /* 结绳螺旋纹样 */
    if(i % 2) return;
    const yy = y + 6.5 + 6.5*(1 + 0.35*Math.sin((x-250)/45));
    g.strokeStyle = '#a67f3a'; g.lineWidth = 1.1;
    g.beginPath(); g.arc(x,yy,3,0,Math.PI*1.7); g.stroke();
    g.fillStyle = 'rgba(150,116,52,0.9)';
    g.beginPath(); g.arc(x+1.4,yy-1.2,0.8,0,Math.PI*2); g.fill();
  });
})();

/* ============================================================
 * 8. 左袖（金赭色褶皱）与双手
 * ============================================================ */
(function hands(){
  /* 左前臂袖：温暖的金赭色，是全画最亮的暖色块之一 */
  g.fillStyle = lg(280,600,360,670,[[0,'#6d5126'],[0.5,'#7d5e2e'],[1,'#4e3a1c']]);
  g.beginPath(); g.moveTo(276,606);
  g.bezierCurveTo(300,598,330,602,348,616);
  g.bezierCurveTo(360,626,362,646,352,660);
  g.bezierCurveTo(336,672,306,676,288,668);
  g.bezierCurveTo(276,662,270,640,274,622);
  g.closePath(); g.fill();
  const sleeveFolds = [
    [292,612,304,634,296,658,'#96763a',3,0.55],
    [306,608,320,632,314,660,'#3f2f15',2.4,0.5],
    [322,610,334,632,328,660,'#8f6c33',2.8,0.5],
    [338,618,346,636,340,656,'#42321a',2.2,0.45],
    [352,628,356,644,350,658,'#7a5c2a',2,0.4],
  ];
  g.lineCap = 'round';
  for(const [x0,y0,cx,cy,x1,y1,col,w,a] of sleeveFolds){
    g.strokeStyle = col; g.globalAlpha = a; g.lineWidth = w;
    g.beginPath(); g.moveTo(x0,y0); g.quadraticCurveTo(cx,cy,x1,y1); g.stroke();
  }
  g.globalAlpha = 1;

  /* ---- 她的左手（在下，搭扶手，指向右侧） ---- */
  g.fillStyle = lg(250,640,340,676,[[0,'#c69a6e'],[0.6,'#b5865c'],[1,'#9d7250']]);
  g.beginPath(); g.moveTo(247,641);
  g.bezierCurveTo(272,632,304,636,328,649);
  g.bezierCurveTo(338,655,340,665,330,670);
  g.bezierCurveTo(306,680,272,681,252,673);
  g.bezierCurveTo(242,669,241,646,247,641);
  g.closePath(); g.fill();
  for(let i=0;i<3;i++){                                       /* 松弛的指头 */
    const y0 = 652+i*6, x0 = 310-i*6;
    g.strokeStyle = '#b9885c'; g.lineWidth = 8.5-i; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x0,y0+2); g.quadraticCurveTo(x0+18,y0+3,x0+30-i*3,y0+6); g.stroke();
    g.strokeStyle = 'rgba(96,58,34,0.55)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x0-2,y0+6.5); g.quadraticCurveTo(x0+16,y0+8,x0+28-i*3,y0+10.5); g.stroke();
  }
  soft(300,646,30,9,'70,44,26',0.35);                         /* 右手压下的阴影 */

  /* ---- 她的右手（在上，覆于左腕，观者左侧） ---- */
  g.fillStyle = rg(212,632,10,52,[[0,'#e3ba8d'],[0.6,'#d2a677'],[1,'#b3865a']]);
  g.beginPath(); g.moveTo(177,614);
  g.bezierCurveTo(167,622,167,640,178,650);
  g.bezierCurveTo(192,661,215,666,235,661);
  g.bezierCurveTo(247,657,251,643,247,631);
  g.bezierCurveTo(243,618,226,609,209,609);
  g.bezierCurveTo(196,609,184,609,177,614);
  g.closePath(); g.fill();
  g.strokeStyle = '#d8ab79'; g.lineWidth = 7.5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(181,621); g.quadraticCurveTo(188,624,196,633); g.stroke();
  for(let i=0;i<4;i++){                                       /* 四指松弛垂在左腕上 */
    const x0 = 203+i*11, y0 = 648+i*1.2;
    g.strokeStyle = '#d9ac7b'; g.lineWidth = 9.6-i*0.9;
    g.beginPath(); g.moveTo(x0,y0); g.quadraticCurveTo(x0+13,y0+6,x0+26,y0+9); g.stroke();
  }
  for(let i=0;i<3;i++){                                       /* 指缝阴影 */
    const x0 = 209+i*11;
    g.strokeStyle = 'rgba(96,58,34,0.5)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x0,654); g.quadraticCurveTo(x0+12,660,x0+24,663); g.stroke();
  }
  soft(212,626,18,9,'240,200,155',0.30);                      /* 手背高光 */
  soft(190,626,6,4,'238,198,152',0.3);                        /* 拇指高光 */
  soft(212,664,40,12,'40,26,14',0.4);                         /* 投在裙上的影 */
  /* 右腕深色袖口 */
  g.fillStyle = '#4a3517';
  g.beginPath(); g.ellipse(172,622,10,15,-0.3,0,Math.PI*2); g.fill();
  soft(212,664,40,12,'40,26,14',0.4);
})();

/* ============================================================
 * 9. 罩染：清漆黄变 + 光线方向
 * ============================================================ */
(function glaze(){
  g.fillStyle = 'rgba(150,105,40,0.10)'; g.fillRect(0,0,SW,SH);
  g.fillStyle = lg(0,0,SW,SH,[[0,'rgba(255,244,205,0.05)'],[0.5,'rgba(0,0,0,0)'],[1,'rgba(30,18,8,0.10)']]);
  g.fillRect(0,0,SW,SH);
})();

/* ============================================================
 * 10. 放大输出 + 做旧（暗角 / 龟裂 / 颗粒 / 木纹）
 * ============================================================ */
out.drawImage(off, 0, 0, art.width, art.height);

/* 暗角 */
const v = out.createRadialGradient(500,700,260, 500,730,880);
v.addColorStop(0,'rgba(20,12,4,0)');
v.addColorStop(0.62,'rgba(20,12,4,0.05)');
v.addColorStop(1,'rgba(15,9,3,0.42)');
out.fillStyle = v;
out.fillRect(0,0,art.width,art.height);

/* 龟裂缝（杨木板老化的网状细纹） */
out.save(); out.lineCap = 'round';
for(let i=0;i<260;i++){
  let x = rr(30,970), y = rr(30,1430);
  let ang = rr(0,Math.PI*2);
  const segs = 2 + Math.floor(rr(0,4));
  out.strokeStyle = `rgba(52,40,24,${rr(0.05,0.12).toFixed(3)})`;
  out.lineWidth = 0.8;
  out.beginPath(); out.moveTo(x,y);
  const pts = [[x,y]];
  for(let s=0;s<segs;s++){
    const len = rr(5,26); ang += rr(-0.9,0.9);
    x += Math.cos(ang)*len; y += Math.sin(ang)*len;
    out.lineTo(x,y); pts.push([x,y]);
  }
  out.stroke();
  if(rnd() < 0.5){                                            /* 裂纹下缘的微光，显浮雕感 */
    out.strokeStyle = 'rgba(255,240,208,0.05)';
    out.beginPath();
    pts.forEach(([px,py],k)=> k ? out.lineTo(px+0.8,py+0.8) : out.moveTo(px+0.8,py+0.8));
    out.stroke();
  }
}
/* 颗粒与杨木竖纹 */
for(let i=0;i<900;i++){
  out.fillStyle = `rgba(${rnd()<0.5 ? '34,24,12' : '235,220,185'},${rr(0.02,0.06).toFixed(3)})`;
  out.fillRect(rr(0,1000), rr(0,1460), rr(0.6,1.6), rr(0.6,1.6));
}
out.strokeStyle = 'rgba(40,28,14,0.05)';
for(let x=0;x<1000;x+=7){
  out.lineWidth = rr(0.5,1.4);
  out.beginPath(); out.moveTo(x+rr(-2,2),0);
  out.bezierCurveTo(x+rr(-4,4),400, x+rr(-4,4),900, x+rr(-3,3),1460);
  out.stroke();
}
out.restore();
</script>
