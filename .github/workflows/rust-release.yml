name: rust-release

on:
  workflow_dispatch:
  push:
    tags: ['rust-v*']

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            rust-target: aarch64-apple-darwin
          - os: ubuntu-latest
            platform: linux-x64
            rust-target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows-x64
            rust-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Metal toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Install GPUI Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake xvfb libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 vulkan-validationlayers
      - name: Test workspace
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a cargo test --locked --workspace
          else
            cargo test --locked --workspace
          fi
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.rust-target }} -p jagent-app --bin j-agent
      - name: Verify release executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="target/${{ matrix.rust-target }}/release/j-agent.exe"
          else
            BIN="target/${{ matrix.rust-target }}/release/j-agent"
          fi
          test -s "$BIN"
          "$BIN" --version
      - name: Package macOS application bundle
        if: runner.os == 'macOS'
        run: scripts/package-macos-app.sh release
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        run: |
          plutil -lint target/package/JAgent.app/Contents/Info.plist
          codesign --verify --deep --strict target/package/JAgent.app
          ditto -c -k --keepParent target/package/JAgent.app target/package/JAgent.app.zip
      - name: Verify Windows icon resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-icon.ps1 "target/${{ matrix.rust-target }}/release/j-agent.exe"
      - name: Smoke-run watchdog integration on release binary
        shell: bash
        run: |
          BIN="target/${{ matrix.rust-target }}/release/j-agent"
          if [[ "${{ runner.os }}" == "Windows" ]]; then BIN="$BIN.exe"; fi
          "$BIN" --version
          "$BIN" --watchdog-smoke
          "$BIN" --watchdog-normal-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: j-agent-${{ matrix.platform }}
          path: |
            target/${{ matrix.rust-target }}/release/j-agent
            target/${{ matrix.rust-target }}/release/j-agent.exe
            target/package/JAgent.app.zip
          if-no-files-found: warn
