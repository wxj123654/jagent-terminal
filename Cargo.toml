[workspace]
resolver = "2"
members = ["crates/*"]
# .refs/ 是旧 gpuix 参考仓库（P8 删除）；spikes/ 是 P0 独立 workspace（P1 删除）。
exclude = [".refs", "spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

# gpui 系列：= 精确锁定，升级须整体进行，且同一工程只允许一份 gpui（AGENTS.md 规则 5）。
# 版本经 crates.io 核实（2026-10-10，docs/p0-results.md §0）。
[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
gpui-component = "=0.7.1"
gpui-base = "=0.7.1"

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
lto = "thin"
strip = "symbols"
