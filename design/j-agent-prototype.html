<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>j-agent — Agent Plane 原型（代码反推）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ═══ tokens.ts / theme/tokens.ts 反推（Zed One Dark）═══ */
:root{
  --app:#282c34; --pane:#1e2127; --sidebar:#21252b; --titlebar:#21252b;
  --terminal:#1a1d23; --surface:#2c313a; --surfaceHover:#333845;
  --surfaceActive:#2c313a; --tile:#2c313a; --tileHover:#333845;
  --overlay:#282c34; --inputBg:#1b1d23; --closeHover:#3a3f4b;
  --text:#abb2bf; --textBright:#d7dae0; --muted:#5c6370; --faint:#7f848e;
  --accent:#61afef; --accentHover:#82c1f2; --accentSoft:rgba(97,175,239,.15);
  --focusBorder:#61afef; --cyan:#56b6c2; --amber:#e5c07b;
  --terminalKind:#98c379; --acpKind:#c678dd; --bell:#e06c75;
  --border:#181a1f; --borderSubtle:#3e4451; --exited:#4b5262; --g300:#5c6370;
  --statusRunning:#e5c07b; --statusNeed:#c678dd; --statusDone:#98c379; --statusError:#e06c75;
  --font-ui:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --font-mono:'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace;
  --sidebarW:264px; --toolbarH:46px; --sbHeadH:52px; --rowH:28px; --rowR:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-ui);background:#16181d;color:var(--text);font-size:13px;
  display:flex;align-items:center;justify-content:center}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3e4451;border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#4b5262;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}
button,input,select,textarea{font-family:inherit;color:inherit;outline:none}
svg{display:block}

/* ═══ 窗口壳（原型演示用：页面内嵌一个可缩放「窗口」）═══ */
#winwrap{display:flex;flex-direction:column;align-items:stretch;width:100vw;height:100vh}
#app{width:100%;height:100%;display:flex;flex-direction:row;background:var(--app);
  color:var(--text);position:relative;overflow:hidden}

/* ═══ 侧栏（Sidebar.tsx：整列 头52/列表/脚）═══ */
#sidebar{width:var(--sidebarW);flex-shrink:0;display:flex;flex-direction:column;
  background:var(--sidebar);border-right:1px solid var(--border);height:100%;min-height:0;
  position:relative}
.sb-resize{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}
.sb-resize:hover{background:rgba(97,175,239,.25)}
.sb-head{height:var(--sbHeadH);flex-shrink:0;display:flex;flex-direction:row;align-items:center}
.sb-head .lead{width:10px;flex-shrink:0}
.sb-scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 8px 8px}
.sb-foot{flex-shrink:0;display:flex;flex-direction:row;align-items:center;gap:2px;
  padding:8px 10px 12px;border-top:1px solid var(--border)}
.sb-foot .ver{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}

/* nav 行（新建会话/搜索） */
.nav-row{display:flex;flex-direction:row;align-items:center;gap:8px;height:30px;
  padding:0 8px;border-radius:var(--rowR);cursor:pointer;user-select:none}
.nav-row:hover{background:var(--surface)}
.nav-row .ic{width:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted)}
.nav-row:hover .ic{color:var(--textBright)}
.nav-row .lbl{font-size:13px;color:var(--text)}
.nav-row:hover .lbl{color:var(--textBright)}

/* 区头「工作区」+ ghost ＋ */
.sec-head{display:flex;flex-direction:row;align-items:center;gap:2px;min-height:26px;
  padding:2px 6px 4px 8px;margin-top:8px}
.sec-head .t{font-size:12px;font-weight:500;color:var(--muted)}
.ghost{width:22px;height:22px;border-radius:9999px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);cursor:pointer;opacity:0;flex-shrink:0}
.ghost:hover{background:var(--surfaceHover)}
.sec-head:hover .ghost,.ws-head:hover .ghost{opacity:1}

/* 工作区分组行 */
.ws-group{display:flex;flex-direction:column}
.ws-head{display:flex;flex-direction:row;align-items:center;flex-shrink:0}
.ws-row{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;height:26px;
  padding:0 6px;gap:5px;border-radius:var(--rowR);cursor:pointer;user-select:none}
.ws-row:hover{background:var(--surface)}
.ws-row.cur .name{color:var(--textBright)}
.ws-row .chev{width:12px;height:12px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;border-radius:3px;color:var(--faint)}
.ws-row .chev:hover{background:var(--surfaceHover)}
.ws-row .name{flex:1;min-width:0;font-size:13px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-row .cur-dot{width:5px;height:5px;border-radius:9999px;background:var(--g300);flex-shrink:0}
/* .acts 是 .ws-head 的子元素（非 .ws-row 后代）——原选择器失效导致
   ghost 钮竖排、ws-head 撑到 44px（意图 28px） */
.ws-head .acts{display:flex;flex-direction:row;flex-shrink:0}
.ws-body{display:flex;flex-direction:column;margin-left:13px;padding-left:9px}
.ws-empty-hint{display:flex;align-items:center;height:22px;margin-left:4px;padding:0 8px;
  border-radius:4px;cursor:pointer;font-size:11px;color:var(--muted)}
.ws-empty-hint:hover{background:var(--surface)}
.more-link{display:flex;align-items:center;height:26px;padding-left:20px;cursor:pointer;
  font-size:11px;color:var(--muted);border-radius:4px}
.more-link:hover{color:var(--text)}

/* 会话行（ThreadRow：h28 r6，18px 状态点槽 + pin + 标题 + 22px …槽） */
.t-row{position:relative;display:flex;flex-direction:row;align-items:center;height:28px;
  padding:0 4px;border-radius:var(--rowR);cursor:pointer;user-select:none}
.t-row:hover{background:var(--surface)}
.t-row.active{background:var(--surfaceActive)}
.t-row .stt{width:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.t-row .pin-ic{display:flex;margin-right:2px;flex-shrink:0;color:var(--faint)}
.t-row .ttl{flex:1;min-width:0;margin:0 4px;font-size:13px;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-row .ttl.unread{font-weight:600;color:var(--textBright)}
.t-row .ttl.exited{color:var(--exited)}
.t-row.active .ttl{color:var(--textBright)}
.t-row .menu-btn{width:22px;height:22px;border-radius:9999px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;opacity:0;color:var(--muted)}
.t-row:hover .menu-btn,.t-row.active .menu-btn{opacity:1}
.t-row .menu-btn:hover{background:var(--closeHover)}
.t-row .rename-in{flex:1;margin:0 4px;height:20px;font-size:12px;line-height:16px;
  color:var(--textBright);background:var(--inputBg);border:1px solid var(--focusBorder);
  border-radius:3px;padding:0 4px;min-width:0}

/* 状态点（DotState） */
.dot{width:7px;height:7px;border-radius:9999px;flex-shrink:0}
.dot.running{background:var(--statusRunning);box-shadow:0 0 0 3px rgba(229,192,123,.15)}
.dot.need{background:var(--statusNeed);box-shadow:0 0 0 3px rgba(198,120,221,.15)}
.dot.done{width:8px;height:8px;background:var(--statusDone)}
.dot.error{width:8px;height:8px;background:var(--statusError)}
.dot.unread{background:var(--muted)}
.dot.idle-on{width:9px;height:9px;background:transparent;border:1.5px solid var(--g300)}

/* 图标钮（IconButton：28px 圆） */
.ibtn{width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);cursor:pointer;flex-shrink:0;position:relative}
.ibtn:hover{background:var(--surfaceHover);color:var(--textBright)}
.ibtn.on{background:var(--surfaceActive);color:var(--textBright)}
.ibtn .badge-dot{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:9999px;
  background:var(--bell);border:1.5px solid var(--sidebar)}

/* 图标规范：装饰性图标统一 --muted（语义色只给状态点/徽标）；尺寸三档见 JS 侧 icon() 注释 */
.ws-row>svg,.ws-head>svg,.ftree .frow>svg,.git-branch-btn>svg,.branch-pop svg{color:var(--muted)}

/* ═══ 主列：工具栏 46px + workbench ═══ */
#main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--pane)}
#titlebar{flex-shrink:0;min-width:0;display:flex;flex-direction:row;align-items:center;gap:8px;
  height:var(--toolbarH);padding-left:12px;padding-right:0;background:var(--app);user-select:none}
#titlebar .cwd{min-width:0;font-size:11.5px;color:var(--faint);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
#titlebar .spacer{flex:1;min-width:0;height:100%}
.chip{display:flex;flex-direction:row;align-items:center;gap:6px;min-width:0;height:28px;
  padding:0 10px;border-radius:9999px;background:var(--tile);cursor:pointer;flex-shrink:0;color:var(--muted)}
.chip:hover{background:var(--tileHover)}
.chip .t{min-width:0;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .t.mono{font-family:var(--font-mono)}
.tb-trailing{display:flex;flex-direction:row;align-items:center;gap:2px;flex-shrink:0}
.win-ctl{display:flex;flex-direction:row;height:100%;flex-shrink:0}
.win-ctl .wb{width:36px;height:100%;display:flex;align-items:center;justify-content:center;
  color:var(--text);cursor:default;font-family:'Segoe MDL2 Assets';font-size:10px}
.win-ctl .wb:hover{background:var(--surface);color:var(--textBright)}
.win-ctl .wb.close:hover{background:#E81120;color:#fff}
.win-ctl .wb.close:active{background:#c50f1d}
#workbench{flex:1;min-height:0;display:flex;flex-direction:row;position:relative}

/* ═══ Home 空态（EmptyPresets / WorkspaceEmpty）═══ */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--pane);padding:0 24px 72px;gap:6px;min-width:0}
.home h1{font-size:22px;font-weight:600;color:var(--textBright);margin-top:8px}
.home .sub{font-size:14px;color:var(--muted);text-align:center}
.home .ctx{display:flex;flex-direction:row;align-items:center;gap:6px;margin-top:18px;
  min-width:0;max-width:560px;color:var(--faint)}
.home .ctx .p{font-size:12px;font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;max-width:560px}
.pill{display:flex;flex-direction:row;align-items:center;gap:7px;height:30px;padding:0 13px;
  border-radius:9999px;background:var(--tile);cursor:pointer;color:var(--muted)}
.pill:hover{background:var(--tileHover)}
.pill .t{font-size:12px;color:var(--text)}

/* ═══ 终端表面（TerminalSurface：无 chrome，palette 底）═══ */
.term-surface{flex:1;display:flex;flex-direction:row;background:var(--terminal);min-width:0;min-height:0}
.term{flex:1;min-width:0;min-height:0;overflow-y:auto;padding:8px 10px;cursor:text;
  font-family:var(--font-mono);font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-all}
.term .ln{min-height:1.45em}
.term .cursor{display:inline-block;width:8px;height:15px;background:var(--text);
  vertical-align:-2px;animation:blink 1.06s steps(1) infinite}
.term.noblink .cursor{animation:none}
@keyframes blink{50%{opacity:0}}
.term .exited-bar{color:var(--exited)}
.term-input{position:absolute;opacity:0;pointer-events:none;left:-9999px}
.c-green{color:var(--terminalKind)} .c-red{color:var(--statusError)} .c-blue{color:var(--accent)}
.c-amber{color:var(--amber)} .c-purple{color:var(--acpKind)} .c-cyan{color:var(--cyan)}
.c-dim{color:var(--muted)} .c-bright{color:var(--textBright)}

/* ═══ 会话表面（ConversationView：chat/acp）═══ */
.conv{flex:1;display:flex;flex-direction:column;background:var(--pane);min-width:0}
.conv-head{display:flex;flex-direction:row;align-items:center;gap:8px;height:36px;
  padding:0 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.conv-pill{font-family:var(--font-mono);font-size:10px;padding:2px 6px;border-radius:3px;
  background:var(--accentSoft)}
.conv-title{font-size:13px;color:var(--textBright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-msgs{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column}
.msg{margin-bottom:16px;display:flex;flex-direction:row;flex-shrink:0}
.msg.user{justify-content:flex-end}
.msg .bubble{max-width:640px;background:var(--accentSoft);border:1px solid var(--borderSubtle);
  border-radius:10px;padding:10px 14px;font-size:14px;color:var(--textBright)}
.msg .role{font-family:var(--font-mono);font-size:10px;color:var(--terminalKind);margin-bottom:4px}
.msg .role.err{color:var(--bell)}
.msg .body{max-width:640px;font-size:14px;color:var(--text);line-height:1.55}
.msg .body code{font-family:var(--font-mono);font-size:12.5px;background:var(--inputBg);
  border-radius:4px;padding:1px 5px}
.msg .body pre{font-family:var(--font-mono);font-size:12px;background:var(--inputBg);
  border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:8px 0;overflow-x:auto}
.msg .body p{margin:6px 0}
.msg .body ul{margin:6px 0 6px 18px}
.thinking{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-bottom:16px}
.composer{display:flex;flex-direction:row;align-items:flex-end;gap:8px;padding:10px 16px 12px;
  border-top:1px solid var(--border);flex-shrink:0}
.composer textarea{flex:1;font-size:13px;line-height:18px;color:var(--textBright);
  background:var(--inputBg);border:1px solid var(--borderSubtle);border-radius:6px;
  padding:8px 10px;resize:none;min-height:34px;max-height:120px}
.composer textarea:focus{border-color:var(--focusBorder)}
.send-btn{display:flex;align-items:center;justify-content:center;height:34px;padding:0 12px;
  border-radius:6px;background:var(--accentSoft);cursor:pointer;user-select:none;
  font-size:12px;color:var(--textBright)}
.send-btn:hover{background:var(--surfaceHover)}
.send-btn.disabled{background:var(--surface);color:var(--muted);cursor:default}

</style>
<style>
/* ═══ 工作面板（WorkPanel：右列，变更/文件）═══ */
#work-panel{width:280px;flex-shrink:0;display:flex;flex-direction:column;min-height:0;
  background:var(--pane);border-left:1px solid var(--border);position:relative}
#work-panel.overlay{position:absolute;top:0;right:0;bottom:0;z-index:30;
  box-shadow:-12px 0 32px rgba(0,0,0,.35)}
.wp-resize{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}
.wp-head{display:flex;flex-direction:row;align-items:center;gap:2px;height:46px;
  padding:0 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.ptab{display:flex;flex-direction:row;align-items:center;gap:5px;height:24px;padding:0 10px;
  border-radius:9999px;cursor:pointer;font-size:11.5px;color:var(--muted)}
.ptab:hover{background:var(--surface)}
.ptab.active{background:var(--surfaceActive);color:var(--textBright)}
.hbtn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);cursor:pointer;flex-shrink:0}
.hbtn:hover{background:var(--surface)}
.wp-body{flex:1;min-height:0;overflow-y:auto;padding:6px;display:flex;flex-direction:column}
.wp-sum{display:flex;flex-direction:row;align-items:center;gap:8px;padding:4px 6px 8px}
.wp-sum .t{font-size:11.5px;font-weight:500;color:var(--muted)}
.wp-sum .n{font-size:10.5px;font-family:var(--font-mono);color:var(--faint);margin-left:auto}
.file-row{display:flex;flex-direction:row;align-items:center;gap:7px;height:28px;padding:0 10px;
  border-radius:8px;cursor:pointer;flex-shrink:0}
.file-row:hover{background:var(--surface)}
.file-row.sel{background:var(--surfaceActive)}
.file-row .bdg{width:18px;font-size:10px;font-family:var(--font-mono);font-weight:700;flex-shrink:0}
.file-row .nm{flex:1;min-width:0;font-size:12px;font-family:var(--font-mono);color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-row.sel .nm{color:var(--textBright)}
.file-row .nm .dir{color:var(--muted)}
.file-row .add{font-size:10px;font-family:var(--font-mono);color:var(--statusDone);flex-shrink:0}
.file-row .del{font-size:10px;font-family:var(--font-mono);color:var(--statusError);flex-shrink:0}
.hint{font-size:11.5px;color:var(--muted);padding:12px;white-space:normal}
.diff{margin-top:6px;border-top:1px solid var(--border);padding-top:6px;
  font-family:var(--font-mono);font-size:11px;line-height:1.5;overflow-x:auto;flex-shrink:0;max-width:100%}
.diff .dl{white-space:pre;padding:0 8px}
.diff .dl.add{background:rgba(152,195,121,.12);color:var(--terminalKind)}
.diff .dl.del{background:rgba(224,108,117,.12);color:var(--statusError)}
.diff .dl.hunk{background:var(--tile);color:var(--cyan)}
.diff .dl.meta{color:var(--muted)}
.code-view{font-family:var(--font-mono);font-size:11px;line-height:1.55;overflow-x:auto}
.code-view .cl{display:flex;white-space:pre}
.code-view .ln-no{width:34px;flex-shrink:0;text-align:right;padding-right:10px;color:var(--muted);
  user-select:none}
.wp-file-head{display:flex;flex-direction:row;align-items:center;gap:6px;padding:4px 6px 8px;
  font-size:11px;font-family:var(--font-mono);color:var(--muted)}

/* ═══ Git 图（GitGraphView）═══ */
.git-view{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--pane)}
.git-toolbar{display:flex;flex-direction:row;align-items:center;gap:8px;height:34px;
  padding:0 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.git-toolbar .lbl{font-size:12px;color:var(--muted)}
.git-toolbar .cnt{font-size:11px;color:var(--muted);margin-left:auto}
.git-branch-btn{display:flex;flex-direction:row;align-items:center;gap:5px;height:22px;
  padding:0 8px;border-radius:4px;background:var(--tile);cursor:pointer;font-size:12px;
  font-family:var(--font-mono);color:var(--text)}
.git-branch-btn:hover{background:var(--tileHover)}
.git-find{display:flex;flex-direction:row;align-items:center;gap:4px}
.git-find input{width:180px;height:24px;font-size:12px;background:var(--inputBg);
  border:1px solid var(--borderSubtle);border-radius:4px;padding:0 8px;color:var(--textBright)}
.git-find input:focus{border-color:var(--focusBorder)}
.git-find .pos{font-size:11px;color:var(--muted);width:40px;text-align:center}
.git-err{display:flex;flex-direction:row;align-items:center;gap:8px;height:33px;padding:0 10px;
  background:rgba(224,108,117,.08);border-bottom:1px solid var(--border);
  font-size:12px;color:var(--statusError);flex-shrink:0}
.git-notrepo{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--muted);font-size:13px}
.git-header{display:flex;flex-direction:row;align-items:center;height:26px;padding:0 12px 0 8px;
  border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);flex-shrink:0}
.git-list{flex:1;min-height:0;overflow-y:auto;position:relative}
.git-row{display:flex;flex-direction:row;align-items:center;height:26px;padding:0 12px 0 0;
  cursor:pointer;flex-shrink:0;position:relative}
.git-row:hover{background:var(--surface)}
.git-row.sel{background:var(--surfaceActive)}
.git-row .gcell{flex-shrink:0;height:26px}
.git-row .desc{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;gap:6px;
  font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.git-row .desc .msg{overflow:hidden;text-overflow:ellipsis}
.git-row.sel .desc{color:var(--textBright)}

/* ── 工具函数（对齐 workspaces.ts / terminal.ts）── */
const threadById = id=>S.threads.find(t=>t.id===id);
const wsById = id=>S.workspaces.find(w=>w.id===id);
function displayTitle(t){ // terminal.ts：customTitle 冻结 > oscTitle > title
  return t.customTitle ?? t.oscTitle ?? t.title;
}
function rowTitle(t){ return t.kind==='terminal' ? displayTitle(t) : t.title; }
function threadPriority(t){ // workspaces.ts §排序
  if(t.kind==='terminal'){ if(t.hasBell) return 1; return t.unread?2:3; }
  if(t.pendingReply) return 0;
  const last=t.messages?.at(-1);
  if(last?.role==='assistant'&&last.error) return 3;
  return t.unread?2:3;
}
function sortThreads(ts){
  return ts.map((t,i)=>({t,i})).sort((a,b)=>
    Number(!!b.t.pin)-Number(!!a.t.pin) || threadPriority(a.t)-threadPriority(b.t) ||
    (b.t.createdAt-a.t.createdAt) || (b.i-a.i)).map(x=>x.t);
}
function sortWorkspaces(ws){
  return [...ws].sort((a,b)=>Number(!!b.pin)-Number(!!a.pin)||a.createdAt-b.createdAt);
}
function statusDot(t){ // ThreadRow.tsx DotState
  if(t.kind==='terminal'){
    if(t.status==='exited') return 'exited';
    if(t.hasBell) return 'need';
    if(t.unread) return 'unread';
    return 'idle';
  }
  if(t.pendingReply) return 'running';
  const last=t.messages?.at(-1);
  if(last?.role==='assistant'&&last.error) return 'error';
  if(t.unread) return 'unread';
  return 'idle';
}
function relTime(at){
  const s=(Date.now()-at)/1e3;
  if(s<60) return '刚刚';
  if(s<3600) return `${Math.floor(s/60)} 分钟前`;
  if(s<86400) return `${Math.floor(s/3600)} 小时前`;
  return `${Math.floor(s/86400)} 天前`;
}
function presetCmdSummary(p){
  if(!p.program) return p.initCommand?`（shell）→ ${p.initCommand}`:'（系统默认 shell）';
  const cmd=[p.program,...(p.args??[])].join(' ');
  return p.initCommand?`${cmd}  →  ${p.initCommand}`:cmd;
}
const presetIcon = p=>p.category==='agent'?'agent':'terminal';
const KIND_ICON = {terminal:'terminal',chat:'chat',acp:'acp'};

/* ── store 动作（对齐 store.ts 规则表）── */
function activate(target){
  if(target?.type==='thread'){
    const t=threadById(target.id);
    if(t){ t.unread=false; t.hasBell=false; }
  }
  if(target?.type!=='settings') S.lastNonSettings=target??S.lastNonSettings;
  S.route=target;
  render();
}
function activateWorkspace(id){
  const ws=wsById(id); if(!ws) return;
  const sessions=S.threads.filter(t=>t.workspaceId===id);
  if(ws.lastSessionId && sessions.some(t=>t.id===ws.lastSessionId)){
    activate({type:'thread',id:ws.lastSessionId});
  } else if(sessions.length){
    activate({type:'thread',id:sortThreads(sessions)[0].id});
  } else {
    ws.paneTab='home';
    activate({type:'workspace',id});
  }
}
function closeThread(id){
  const t=threadById(id); if(!t) return;
  const ws=t.workspaceId?wsById(t.workspaceId):null;
  if(t.kind==='terminal' && t.status!=='exited' && !S.settings.terminal.closeOnExit){
    t.status='exited'; // 默认保留灰行
  } else {
    S.threads=S.threads.filter(x=>x.id!==id);
  }
  if(S.route?.type==='thread'&&S.route.id===id){
    const rest=S.threads.filter(x=>x.workspaceId===t.workspaceId);
    if(rest.length) activate({type:'thread',id:sortThreads(rest)[0].id});
    else if(ws) activate({type:'workspace',id:ws.id});
    else activate(null);
  } else render();
}
function spawnFromPreset(presetId, workspaceId){
  const p=S.settings.presets.items.find(x=>x.id===presetId); if(!p) return;
  const ws=workspaceId?wsById(workspaceId):S.workspaces[0];
  const t={id:uid('t'),kind:'terminal',title:p.label,workspaceId:ws?.id??null,
    sessionId:100+S.threads.length,status:'running',cwd:p.cwd??ws?.path??'',createdAt:Date.now()};
  S.threads.push(t);
  if(ws){ws.expanded=true;ws.lastSessionId=t.id;}
  termScript(t,p);
  activate({type:'thread',id:t.id});
  toast(`已启动 ${p.label}`);
}
function createChat(workspaceId){
  const ws=wsById(workspaceId); if(!ws) return;
  const t={id:uid('t'),kind:'chat',title:'New Chat',workspaceId,createdAt:Date.now(),messages:[],pendingReply:false};
  S.threads.push(t); ws.expanded=true; activate({type:'thread',id:t.id});
}

  const ws=wsById(workspaceId); if(!ws) return;

    messages:[{id:uid('m'),role:'assistant',text:`ACP session initialized: \`${S.settings.acpAgents.find(a=>a.id===agentId)?.command}\``}],pendingReply:false};
  S.threads.push(t); ws.expanded=true; activate({type:'thread',id:t.id});
}

  t.messages.push({id:uid('m'),role:'user',text});
  t.pendingReply=true; render();
  setTimeout(()=>{
    t.messages.push({id:uid('m'),role:'assistant',
      text:t.kind==='acp'
        ?`收到。ACP agent 回显：\n\n\`\`\`\n${text}\n\`\`\``
        :`Echo：${text}\n\n这是原型模拟回复——真实实现里这里走 ChatAgent seam（chat 的 EchoAgent / acp 的 JSON-RPC 连接）。`});
    t.pendingReply=false;
    if(!(S.route?.type==='thread'&&S.route.id===t.id)) t.unread=true;
    render();
  },900);
}
function searchThreads(q){
  const lower=q.toLowerCase(); const hits=[];
  for(const t of S.threads){
    const ws=t.workspaceId?wsById(t.workspaceId):null;
    const title=t.kind==='terminal'?displayTitle(t):t.title;
    const tool=t.kind==='terminal'?(S.settings.presets.items.find(p=>p.id===t.preset)?.label??'Terminal'):t.kind==='acp'?'ACP':'Chat';
    const dir=t.kind==='terminal'?t.cwd:(ws?.path??'');
    if(`${title} ${tool} ${dir} ${ws?.name??''} ${ws?.path??''}`.toLowerCase().includes(lower))
      hits.push({thread:t,workspace:ws});
  }
  return hits;
}
function toast(msg){
  const host=document.getElementById('toasts'); if(!host) return;
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  host.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .2s';setTimeout(()=>el.remove(),220)},2600);
}
function pushNotice(tone,title,sub){ S.notices.push({id:uid('n'),tone,title,sub,at:Date.now()}); }

/* ── 渲染框架：焦点保留 ── */
const app=document.getElementById('app');
function render(){
  const ae=document.activeElement;
  const fid=ae?.dataset?.fid, ss=ae?.selectionStart, se=ae?.selectionEnd;
  app.innerHTML=renderApp();
  bindAll(app);
  if(fid){
    const el=app.querySelector(`[data-fid="${fid}"]`);
    if(el){el.focus(); if(ss!=null&&el.setSelectionRange) el.setSelectionRange(ss,se);}
  }
}
function bindAll(root){
  root.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();dispatch(el.dataset.act,el,e);});
  });
  root.querySelectorAll('[data-ctx]').forEach(el=>{
    el.addEventListener('contextmenu',e=>{e.preventDefault();openCtx(el.dataset.ctx,el,e);});
  });
  root.querySelectorAll('[data-dbl]').forEach(el=>{
    el.addEventListener('dblclick',e=>{e.stopPropagation();dispatch(el.dataset.dbl,el,e);});
  });
}
</script>

function sessionChip(){

function renderConversation(t){
  const pill=t.kind==='acp'?'ACP':'CHAT';

  const ph=t.kind==='acp'?'Ask agent…':'Ask…';

      ${(t.messages??[]).map(m=>renderMsg(m)).join('')}

    <div class="composer">
      <textarea data-fid="composer-${t.id}" placeholder="${ph}" rows="1" data-compose="${t.id}"></textarea>
      <div class="send-btn${t.pendingReply?' disabled':''}" data-act="send" data-id="${t.id}">Send</div>
    </div>

function mdLite(text){
  let h=esc(text);
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>`<pre>${c}</pre>`);
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');
  h=h.split(/\n{2,}/).map(p=>p.startsWith('<pre')||p.startsWith('<ul')?p:`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
  return h;
}
function renderMsg(m){
  if(m.role==='user')
    return `<div class="msg user"><div class="bubble">${esc(m.text).replace(/\n/g,'<br>')}</div></div>`;
  return `<div class="msg"><div><div class="role${m.error?' err':''}">${m.error?'ERROR':'ASSISTANT'}</div>
    <div class="body"${m.error?' style="color:var(--bell)"':''}>${mdLite(m.text)}</div></div></div>`;
}

const SYSTEM_FONTS=(()=>{
  const ok=n=>{try{return document.fonts?.check(`12px "${n}"`)}catch{return true}};

/* 过滤与 gpuix Combobox defaultFilter 同序：startsWith 优先于 includes，
   各自保持原序；当前值不在系统清单时并到最前（仍可搜到/选中）。 */
function fontItems(path){
  const p=S.ui.fontPicker, q=(p?.q??'').trim().toLowerCase();
  const cur=String(getPath(S.settings,path));
  const base=SYSTEM_FONTS.includes(cur)?SYSTEM_FONTS:[cur,...SYSTEM_FONTS];
  let items;
  if(!q) items=base.map(name=>({name}));
  else{
    const scored=[];
    base.forEach((name,i)=>{const l=name.toLowerCase();
      const rank=l.startsWith(q)?0:l.includes(q)?1:-1;
      if(rank>=0) scored.push({name,rank,i});});
    items=scored.sort((a,b)=>a.rank-b.rank||a.i-b.i);
  }
  const qRaw=(p?.q??'').trim();
  if(qRaw&&!base.some(n=>n.toLowerCase()===qRaw.toLowerCase()))
    items.push({name:qRaw,free:true});

    for(const l of r.lanes){

      s+=`<line x1="${laneX(l)}" y1="${y}" x2="${laneX(l)}" y2="${y+H}" stroke="${c}" stroke-width="1.5" opacity="0.85"/>`;
      if(i===0) s+=`<line x1="${laneX(l)}" y1="${y-4}" x2="${laneX(l)}" y2="${y}" stroke="${c}" stroke-width="1.5" opacity="0.85"/>`;

function renderDiff(f){
  const patch=DIFFS[f.path];
  if(f.status==='a') return '<div class="hint">未跟踪文件——无 diff，在「文件」页查看内容。</div>';
  if(!patch) return '<div class="hint">未跟踪文件——无 diff，在「文件」页查看内容。</div>';
  const lines=patch.split('\n').map(l=>{
    let cls='';
    if(l.startsWith('@@')) cls='hunk';
    else if(l.startsWith('+')) cls='add';
    else if(l.startsWith('-')) cls='del';
    else if(l.startsWith('diff')||l.startsWith('index')) cls='meta';
    return `<div class="dl ${cls}">${esc(l)||' '}</div>`;
  }).join('');
  return `<div class="diff">${lines}</div>`;
}
function renderPreview(f){
  const code=PREVIEWS[f.path]??`// ${f.path}\n// （原型预览占位）`;
  return `<div class="code-view">${code.split('\n').map((l,i)=>
    `<div class="cl"><span class="ln-no">${i+1}</span><span>${esc(l)||' '}</span></div>`).join('')}</div>`;
}

<script>
'use strict';
/* ═══ 终端模拟（TerminalSurface 替身：DOM 缓存保活，切走 retain）═══ */
const termCache={};
function termEl(t){
  if(termCache[t.id]) return termCache[t.id];
  const el=document.createElement('div');
  el.className='term'; el.tabIndex=0;
  el.dataset.termid=t.id;
  el.innerHTML=`<div class="ln"><span class="c-dim"># ${esc(t.cwd||'~')} — ${esc(rowTitle(t))}（session ${t.sessionId}）</span></div>`;
  if(t.status==='exited'){
    el.innerHTML+=`<div class="ln exited-bar"><span class="c-dim">[进程已退出 · exit code 0] — 灰行保留，「退出后直接关闭」开启时销毁</span></div>`;
  } else {
    el.innerHTML+=`<div class="ln"><span class="c-green">❯</span> <span class="t-in"></span><span class="cursor"></span></div>`;
  }
  el._buf='';
  el.addEventListener('keydown',e=>termKey(t,el,e));
  termCache[t.id]=el;
  return el;
}
function termPrint(el,html){
  const cur=el.querySelector('.ln:last-child');
  const div=document.createElement('div'); div.className='ln'; div.innerHTML=html;
  el.insertBefore(div,cur);
  el.scrollTop=el.scrollHeight;
}
function termKey(t,el,e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const inEl=el.querySelector('.t-in');
  if(!inEl) return;
  if(e.key==='Enter'){
    const cmd=el._buf; el._buf='';
    inEl.textContent=cmd;
    el.querySelector('.cursor')?.remove();
    runTermCmd(t,el,cmd);
    if(t.status!=='exited'){
      const ln=document.createElement('div'); ln.className='ln';
      ln.innerHTML=`<span class="c-green">❯</span> <span class="t-in"></span><span class="cursor"></span>`;
      el.appendChild(ln);
    }
    el.scrollTop=el.scrollHeight;
    e.preventDefault();
  } else if(e.key==='Backspace'){
    el._buf=el._buf.slice(0,-1); inEl.textContent=el._buf; e.preventDefault();
  } else if(e.key.length===1){
    el._buf+=e.key; inEl.textContent=el._buf; e.preventDefault();
  }
}
function runTermCmd(t,el,cmd){
  const c=cmd.trim();
  if(c==='') return;
  if(c==='exit'){
    termPrint(el,'<span class="c-dim">exit</span>');
    termPrint(el,'<span class="exited-bar c-dim">[进程已退出 · exit code 0]</span>');
    setTimeout(()=>{
      t.status='exited';
      if(S.settings.terminal.closeOnExit){S.threads=S.threads.filter(x=>x.id!==t.id);}
      if(S.route?.type==='thread'&&S.route.id===t.id) activate(null); else render();
    },300);
    return;
  }
  if(c==='clear'){ el.innerHTML=''; return; }
  if(c==='bell'||c==="printf '\\a'"){
    termPrint(el,'<span class="c-dim"># 触发 BEL（\\x07）——切走后该行出现紫点 + 通知</span>');
    setTimeout(()=>{
      if(!(S.route?.type==='thread'&&S.route.id===t.id)){
        t.hasBell=true;
        pushNotice('warn',`「${rowTitle(t)}」等待注意`,(wsById(t.workspaceId)?.name??'未归属')+' · BEL');
        if(S.settings.notifications.desktop) toast(`🔔 ${rowTitle(t)} 等待注意`);
        render();
      } else termPrint(el,'<span class="c-dim"># 当前已聚焦——BEL 不落红点（契约：仅未聚焦时）</span>');
    },600);
    return;
  }
  if(c.startsWith('title ')){
    t.oscTitle=c.slice(6); termPrint(el,`<span class="c-dim"># OSC 标题 → ${esc(t.oscTitle)}</span>`);
    render(); return;
  }
  if(c==='ls'||c==='dir'){
    termPrint(el,'<span class="c-blue">crates/  packages/  design/  docs/  e2e/</span>  AGENTS.md  Cargo.toml  package.json  README.md  TODOLIST.md'); return;
  }
  if(c==='git status'||c==='git st'){
    termPrint(el,'<span class="c-dim">On branch </span><span class="c-green">main</span>');
    termPrint(el,'<span class="c-dim">Changes not staged:</span>');
    termPrint(el,'  <span class="c-red">modified:   packages/app/src/plane/Sidebar.tsx</span>');
    termPrint(el,'  <span class="c-red">modified:   packages/app/src/plane/WorkspaceList.tsx</span>'); return;
  }
  if(c==='pi'||c==='claude'||c==='codex'||c==='amp'){
    termPrint(el,`<span class="c-purple">◆ ${c}</span> <span class="c-dim">agent 会话已接入（模拟输出）</span>`);
    termPrint(el,'<span class="c-dim">  读取 AGENTS.md … 就绪。输入 prompt 开始。</span>'); return;
  }
  if(c.startsWith('echo ')){ termPrint(el,esc(c.slice(5))); return; }
  termPrint(el,`<span class="c-dim">$ ${esc(c)}</span>`);
  termPrint(el,'<span class="c-dim">（原型模拟终端——试试 ls / git status / bell / title xxx / exit）</span>');
}
function termScript(t,p){
  setTimeout(()=>{
    const el=termCache[t.id]; if(!el) return;
    termPrint(el,`<span class="c-dim"># spawn: ${esc(p.program??'（系统默认 shell）')}${p.initCommand?` → ${esc(p.initCommand)}`:''}</span>`);
    if(p.initCommand) termPrint(el,`<span class="c-purple">◆ ${esc(p.initCommand)}</span> <span class="c-dim">ready</span>`);
    el.scrollTop=el.scrollHeight;
  },50);
}
function mountTerminals(){
  app.querySelectorAll('[data-termslot]').forEach(slot=>{
    const t=threadById(slot.dataset.termslot);
    if(!t) return;
    const el=termEl(t);
    el.style.fontSize=S.settings.terminal.fontSize+'px';
    el.style.fontFamily=S.settings.terminal.fontFamily+',monospace';
    el.classList.toggle('noblink',!S.settings.terminal.cursorBlink);
    // replaceWith 会把带 --terminal 底的 .term-surface 容器换掉（终端透出
    // pane 色）——改为挂进 slot 内，保留容器背景
    slot.appendChild(el);
    // 挂载即请求焦点（focused prop）——但弹窗/输入态不抢焦
    const ae=document.activeElement;
    const inputBusy=/INPUT|TEXTAREA|SELECT/.test(ae?.tagName??'');
    if(S.ui.dialog.kind==='none'&&!S.ui.ctxMenu&&!inputBusy) el.focus();
  });
}

/* ═══ 动作分发 ═══ */
function dispatch(act,el,e){
  const id=el?.dataset?.id;
  switch(act){
    case 'noop': break;
    case 'sidebar-collapse': case 'toggle-sidebar':
      if(S.ui.winW<NARROW_BP) S.ui.drawerOpen=!S.ui.drawerOpen; else S.ui.sidebarHidden=!S.ui.sidebarHidden;
      render(); break;
    case 'drawer-toggle': S.ui.drawerOpen=!S.ui.drawerOpen; render(); break;
    case 'drawer-close': S.ui.drawerOpen=false; render(); break;
    case 'nav-new': openToolDialog(newSessionWorkspace()); break;
    case 'nav-search': S.ui.dialog={kind:'search'}; S.ui.searchQuery=''; S.ui.searchCursor=0; render(); break;
    case 'add-workspace': S.ui.dialog={kind:'addWorkspace'}; render(); break;
    case 'open-settings': S.lastNonSettings=S.route?.type!=='settings'?S.route:S.lastNonSettings; S.route={type:'settings'}; render(); break;
    case 'open-notif': S.ui.notifOpen=!S.ui.notifOpen; S.ui.ctxMenu=null; render(); break;
    case 'notif-clear': S.noticesRead=S.notices.length; render(); break;
    case 'ws-activate': activateWorkspace(id); break;
    case 'ws-toggle': {const ws=wsById(id); ws.expanded=!ws.expanded; render(); break;}
    case 'ws-new': openToolDialog(id); break;
    case 'ws-menu': openWsMenu(id,el); break;
    case 'ws-showall': wsById(id).showAll=true; render(); break;
    case 'ws-showless': wsById(id).showAll=false; render(); break;
    case 'unassigned-showall': S.unassignedShowAll=true; render(); break;
    case 'unassigned-showless': S.unassignedShowAll=false; render(); break;

    case 'thread-activate': activate({type:'thread',id}); break;
    case 'thread-menu': openThreadMenu(id,el); break;
    case 'thread-rename': startInlineRename(id); break;
    case 'ws-rename': startWsRename(id); break;
    case 'preset-pick': spawnFromPreset(id,S.workspaces[0]?.id); break;
    case 'preset-pick-ws': spawnFromPreset(id,el.dataset.ws); break;
    case 'chip-session': openToolDialog(newSessionWorkspace()); break;
    case 'chip-branch': {
      const r=el.getBoundingClientRect(),ar=app.getBoundingClientRect();
      S.ui.ctxMenu={kind:'tbgit',id:'',x:r.left-ar.left,y:r.bottom-ar.top+4,items:[

    case 'tool-acp': {const a=S.settings.acpAgents.find(x=>x.id===id); S.ui.dialog={kind:'none'}; createAcp(id,a?.label??'ACP',S.ui.toolWs); break;}
    case 'search-pick': S.ui.dialog={kind:'none'}; activate({type:'thread',id}); break;

    case 'ws-add-ok': {

      else if(tg?.type==='workspace'){const w=wsById(tg.id); if(w)w.name=v;}

    case 'crash-open': toast('已在系统文件管理器打开（原型占位）'); break;
    case 'ctx-pick': ctxPick(id); break;
    case 'wp-tab': S.ui.panelTab=el.dataset.tab; render(); break;
    case 'wp-file': S.worktree.selected=el.dataset.path; render(); break;

    case 'st-toggle': {const p=el.dataset.path; setPath(S.settings,p,!getPath(S.settings,p)); render(); break;}
    case 'st-reset': {const p=el.dataset.path; setPath(S.settings,p,DEFAULTS[p]); render(); break;}
    case 'font-open': {
      if(S.ui.fontPicker?.path===el.dataset.path){S.ui.fontPicker=null;render();break;}

      S.ui.fontPicker={path:el.dataset.path,q:'',hi:0,
        x:Math.max(8,Math.min(r.left-ar.left,ar.width-FONT_POP_W-12)),
        y:r.bottom-ar.top+4};
      render();
      app.querySelector('[data-fontq]')?.focus();
      break;}
    case 'font-pick': commitFont(S.ui.fontPicker?.path,el.dataset.value); break;
    case 'kb-cap': S.ui.kbCapturing=id; render(); break;
    case 'preset-expand': S.ui.expandedPreset=S.ui.expandedPreset===id?null:id; render(); break;
    case 'preset-add': {const np={id:uid('preset'),label:'自定义预设',category:'tool',builtin:false,args:[],env:{}}; S.settings.presets.items.push(np); S.ui.expandedPreset=np.id; render(); break;}
    case 'preset-dup': {const p=S.settings.presets.items.find(x=>x.id===id); const np={...p,id:uid('preset'),label:p.label+' 副本',builtin:false}; S.settings.presets.items.push(np); S.ui.expandedPreset=np.id; render(); break;}
    case 'preset-del': S.settings.presets.items=S.settings.presets.items.filter(x=>x.id!==id); if(S.settings.presets.plusDefault===id)S.settings.presets.plusDefault=null; render(); break;
    case 'preset-reset': {const p=S.settings.presets.items.find(x=>x.id===id); delete p._mod; toast('已恢复内置预设默认'); render(); break;}
    case 'agent-expand': S.ui.expandedAgent=S.ui.expandedAgent===id?null:id; render(); break;
    case 'agent-add': {const a={id:uid('acp'),label:'New Agent',command:'',args:[]}; S.settings.acpAgents.push(a); S.ui.expandedAgent=a.id; render(); break;}
    case 'agent-del': S.settings.acpAgents=S.settings.acpAgents.filter(x=>x.id!==id); render(); break;
    case 'git-row': S.git.selectedSha=S.git.selectedSha===el.dataset.sha?null:el.dataset.sha; render(); break;
    case 'git-branch-open': S.ui.gitBranchOpen=!S.ui.gitBranchOpen; render(); break;
    case 'git-checkout': {const b=S.git.branches.find(x=>x.name===el.dataset.name); if(b&&!b.current){S.git.branches.forEach(x=>x.current=false);b.current=true;S.git.branch=b.name;S.worktree.branch=b.name;toast(`已切换到 ${b.name}`);} S.ui.gitBranchOpen=false; render(); break;}
    case 'git-remote': S.git.showRemote=!S.git.showRemote; render(); break;
    case 'git-find-open': S.ui.gitFindOpen=true; render(); break;
    case 'git-find-close': S.ui.gitFindOpen=false; S.ui.gitFindDraft=''; render(); break;
    case 'git-find-prev': gitFindStep(-1); break;
    case 'git-find-next': gitFindStep(1); break;
    case 'git-settings': toast('设置面板：后续版本提供'); break;
    case 'git-fetch': toast('git fetch --all --prune（原型模拟）'); break;
    case 'git-refresh': toast('已刷新'); break;
  }
}
function newSessionWorkspace(){
  const r=S.route;
  if(r?.type==='thread'){const t=threadById(r.id); if(t?.workspaceId) return t.workspaceId;}
  if(r?.type==='workspace') return r.id;
  return S.workspaces[0]?.id??'';
}
function openToolDialog(wsId){
  S.ui.toolWs=wsId; S.ui.toolWsIncludeTemp=wsId===''; S.ui.toolFilter='';
  S.ui.dialog={kind:'tool'}; render();
}
function openGitGraph(){
  const r=S.route;
  let wsId=r?.type==='workspace'?r.id:null;
  if(r?.type==='thread') wsId=threadById(r.id)?.workspaceId??null;
  wsId=wsId??S.workspaces[0]?.id;
  if(!wsId) return;
  const ws=wsById(wsId); ws.paneTab='git';
  activate({type:'workspace',id:wsId});
}
function gitFindStep(d){
  const q=S.ui.gitFindDraft.trim().toLowerCase(); if(!q) return;
  const m=GIT_COMMITS.map((c,i)=>({c,i})).filter(x=>x.c.msg.toLowerCase().includes(q)||x.c.sha.startsWith(q));
  if(!m.length) return;
  S.git.findIdx=(S.git.findIdx+d+m.length)%m.length;
  S.git.selectedSha=m[S.git.findIdx].c.sha;
  render();
}

function ctxPick(id){
  const m=S.ui.ctxMenu; S.ui.ctxMenu=null;
  if(!m) return;
  if(m.kind==='thread'){
    const t=threadById(m.id); if(!t){render();return;}
    if(id==='pin') t.pin=!t.pin;
    else if(id==='unread') t.unread=!t.unread;
    else if(id==='rename'){S.ui.dialog={kind:'rename',target:{type:'thread',id:m.id}};}
    else if(id==='remove'){closeThread(m.id);return;}
  } else if(m.kind==='workspace'){
    const w=wsById(m.id); if(!w){render();return;}
    if(id==='pin') w.pin=!w.pin;
    else if(id==='rename') S.ui.dialog={kind:'rename',target:{type:'workspace',id:m.id}};
    else if(id==='remove'){
      S.threads=S.threads.filter(t=>t.workspaceId!==m.id);
      S.workspaces=S.workspaces.filter(x=>x.id!==m.id);
      if(S.route?.type==='workspace'&&S.route.id===m.id) S.route=S.workspaces[0]?{type:'workspace',id:S.workspaces[0].id}:null;
      toast('工作区已移除');
    }
  } else if(m.kind==='tbgit'){
    if(id==='graph'){openGitGraph();return;}
    else if(id==='changes'){S.ui.panelTab='changes';S.ui.panelOpen=true;}
  } else if(m.kind==='git'){
    if(id==='copy-sha') toast(`已复制 ${m.id}`);
    else if(id==='checkout') toast(`checkout ${m.id}（原型模拟）`);
    else if(id==='branch-here') toast('创建分支（原型模拟）');
    else if(id==='reset-hard') toast(`reset --hard ${m.id}（原型模拟）`);
  }
  render();
}

/* ═══ 全局键位（keybindings.ts 分层）═══ */
function ksMatch(ks,key,ctrl,shift,cmd){
  const parts=ks.split('-'); const k=parts.at(-1);
  if(k===''||parts.includes('alt')) return false;
  return key===k&&ctrl===parts.includes('ctrl')&&shift===parts.includes('shift')&&cmd===parts.includes('cmd');
}
const evKey=e=>e.key===' '?'space':e.key.toLowerCase();
function cycle(d){
  const order=[];
  for(const ws of sortWorkspaces(S.workspaces)) order.push(...sortThreads(S.threads.filter(t=>t.workspaceId===ws.id)));
  order.push(...sortThreads(S.threads.filter(t=>t.workspaceId==null)));
  if(!order.length) return;
  const cur=S.route?.type==='thread'?order.findIndex(t=>t.id===S.route.id):-1;
  const next=order[(cur+d+order.length)%order.length];
  activate({type:'thread',id:next.id});
}
document.addEventListener('keydown',e=>{
  const key=evKey(e),ctrl=e.ctrlKey,shift=e.shiftKey,cmd=e.metaKey;
  const kb=S.settings.keybindings;
  const inSettings=S.route?.type==='settings';
  const inInput=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName??'');
  if(S.ui.kbCapturing){
    e.preventDefault();
    if(key==='escape'){S.ui.kbCapturing=null;render();return;}
    if(['control','shift','alt','meta'].includes(key)) return;
    const s=(ctrl?'ctrl-':'')+(shift?'shift-':'')+(cmd?'cmd-':'')+key;
    S.settings.keybindings[S.ui.kbCapturing]=s;
    S.ui.kbCapturing=null; render(); return;
  }
  if(S.ui.dialog.kind!=='none'){
    if(key==='escape'){e.preventDefault();S.ui.dialog={kind:'none'};render();}
    if(S.ui.dialog.kind==='search'){
      if(key==='arrowdown'){e.preventDefault();S.ui.searchCursor++;render();}
      else if(key==='arrowup'){e.preventDefault();S.ui.searchCursor=Math.max(0,S.ui.searchCursor-1);render();}
      else if(key==='enter'){
        const r=searchThreads(S.ui.searchQuery.trim());
        const hit=r[Math.min(S.ui.searchCursor,r.length-1)];
        if(hit){S.ui.dialog={kind:'none'};activate({type:'thread',id:hit.thread.id});}
      }
    }
    if(S.ui.dialog.kind==='rename'&&key==='enter') dispatch('rename-ok',null,e);
    return;
  }
  if(key==='escape'&&(S.ui.ctxMenu||S.ui.notifOpen||S.ui.gitBranchOpen||S.ui.fontPicker)){
    S.ui.ctxMenu=null;S.ui.notifOpen=false;S.ui.gitBranchOpen=false;S.ui.fontPicker=null;render();return;
  }
  if(!ctrl&&inSettings){
    if(key==='escape'){
      if(S.ui.settingsQuery===''){S.route=S.lastNonSettings;render();}
      else{S.ui.settingsQuery='';render();}
      return;
    }
    if(ksMatch(kb.focusSearch,key,ctrl,shift)&&!inInput){
      e.preventDefault();app.querySelector('[data-setq]')?.focus();return;
    }
  }
  if(!inSettings&&ksMatch(kb.searchThreads,key,ctrl,shift,cmd)){e.preventDefault();S.ui.dialog={kind:'search'};S.ui.searchQuery='';S.ui.searchCursor=0;render();return;}
  if(!inSettings&&ksMatch(kb.newSession,key,ctrl,shift,cmd)){e.preventDefault();openToolDialog(newSessionWorkspace());return;}
  if(ksMatch(kb.toggleSidebar,key,ctrl,shift,cmd)){e.preventDefault();dispatch('toggle-sidebar',null,e);return;}
  if(key==='escape'&&!ctrl&&!cmd&&S.ui.winW<NARROW_BP&&S.ui.drawerOpen){S.ui.drawerOpen=false;render();return;}
  if(!ctrl&&!inSettings&&!inInput&&S.route?.type==='workspace'&&wsById(S.route.id)?.paneTab==='git'){
    if(key==='r'){toast('已刷新');return;}
    if(key==='escape'){S.git.selectedSha=null;render();return;}
    if(key==='arrowdown'||key==='arrowup'){
      const i=GIT_COMMITS.findIndex(c=>c.sha===S.git.selectedSha);
      const n=key==='arrowdown'?Math.min(i+1,GIT_COMMITS.length-1):Math.max(i-1,0);
      S.git.selectedSha=GIT_COMMITS[n<0?0:n].sha; e.preventDefault(); render(); return;
    }
    if(key==='enter'){e.preventDefault();return;}
  }
  if(!ctrl) return;
  if(ksMatch(kb.cycleNext,key,ctrl,shift)){e.preventDefault();cycle(1);}
  else if(ksMatch(kb.cyclePrev,key,ctrl,shift)){e.preventDefault();cycle(-1);}
  else if(ksMatch(kb.toggleSettings,key,ctrl,shift)){
    e.preventDefault();
    if(inSettings) S.route=S.lastNonSettings;
    else{S.lastNonSettings=S.route;S.route={type:'settings'};}
    render();
  }
  else if(ctrl&&shift&&key==='g'){e.preventDefault();openGitGraph();}
});

/* ═══ 输入/变更事件（委托）═══ */
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset?.setq!==undefined){S.ui.settingsQuery=el.value;render();}
  else if(el.dataset?.toolfilter!==undefined){S.ui.toolFilter=el.value;render();}

  else if(el.dataset?.gitfind!==undefined){S.ui.gitFindDraft=el.value;S.git.findIdx=0;render();}
  else if(el.dataset?.fontq!==undefined){const p=S.ui.fontPicker; if(p){p.q=el.value;p.hi=0;render();}}
  else if(el.dataset?.rename){const t=threadById(el.dataset.rename); if(t) t._draft=el.value;}
  else if(el.dataset?.range){setPath(S.settings,el.dataset.range,Number(el.value));
    const pct=((el.value-el.min)/(el.max-el.min)*100).toFixed(1);
    el.style.setProperty('--fill',pct+'%');
    el.nextElementSibling.textContent=el.value+'px';
    document.querySelectorAll('#sidebar,#drawer-panel').forEach(s=>s.style.width=el.value+'px');}
  else if(el.dataset?.num){setPath(S.settings,el.dataset.num,Number(el.value));}
  else if(el.dataset?.text){setPath(S.settings,el.dataset.text,el.value);}
  else if(el.dataset?.pf){const[pid,f]=el.dataset.pf.split(':');const p=S.settings.presets.items.find(x=>x.id===pid);
    if(p){p[f]=f==='args'?el.value.split('\n').filter(Boolean):f==='env'?Object.fromEntries(el.value.split('\n').filter(l=>l.includes('=')).map(l=>l.split('='))):el.value;p._mod={...p._mod,[f]:1};}}
  else if(el.dataset?.af){const[aid,f]=el.dataset.af.split(':');const a=S.settings.acpAgents.find(x=>x.id===aid);
    if(a) a[f]=f==='args'?el.value.split('\n').filter(Boolean):el.value;}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset?.set){setPath(S.settings,el.dataset.set,el.value);render();}
  else if(el.dataset?.setplus!==undefined){S.settings.presets.plusDefault=el.value||null;render();}
  else if(el.dataset?.toolws!==undefined){S.ui.toolWs=el.value;render();}
});
document.addEventListener('keydown',e=>{
  const el=e.target;
  if(el?.dataset?.compose&&e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    const t=threadById(el.dataset.compose);
    if(t&&el.value.trim()&&!t.pendingReply){sendChat(t,el.value);el.value='';}
  }
  if(el?.dataset?.rename){
    const t=threadById(el.dataset.rename);
    if(e.key==='Enter'){t._editing=false;if(t.kind==='terminal')t.customTitle=t._draft;else t.title=t._draft;render();}
    if(e.key==='Escape'){t._editing=false;render();}
  }
  if(el?.dataset?.renamedlg!==undefined&&e.key==='Enter') dispatch('rename-ok',null,e);
  if(el?.dataset?.searchq!==undefined&&e.key==='Escape'&&el.value){S.ui.searchQuery='';render();e.stopPropagation();}
  if(el?.dataset?.fontq!==undefined&&S.ui.fontPicker){
    const p=S.ui.fontPicker, items=fontItems(p.path), len=items.length;
    if(e.key==='ArrowDown'&&len){p.hi=(p.hi+1)%len;render();e.preventDefault();}
    else if(e.key==='ArrowUp'&&len){p.hi=(p.hi-1+len)%len;render();e.preventDefault();}
    else if(e.key==='Enter'&&len){commitFont(p.path,items[p.hi]?.name);e.preventDefault();}
    else if(e.key==='Escape'){S.ui.fontPicker=null;render();e.stopPropagation();}
  }
},true);
/* 遮罩/外点关闭 */
document.addEventListener('mousedown',e=>{
  if(e.target.dataset?.scrim!==undefined){S.ui.dialog={kind:'none'};render();return;}
  if(S.ui.ctxMenu&&!e.target.closest('.ctx-menu')){S.ui.ctxMenu=null;render();}
  if(S.ui.notifOpen&&!e.target.closest('.notif-pop')&&!e.target.closest('[data-act="open-notif"]')){S.ui.notifOpen=false;render();}
  if(S.ui.gitBranchOpen&&!e.target.closest('.branch-pop')&&!e.target.closest('[data-act="git-branch-open"]')){S.ui.gitBranchOpen=false;render();}
  if(S.ui.fontPicker&&!e.target.closest('.font-pop')&&!e.target.closest('[data-act="font-open"]')){S.ui.fontPicker=null;render();}
});
/* 工作面板拖拽 */
let wpDrag=false;
document.addEventListener('mousedown',e=>{if(e.target.id==='wp-resize'){wpDrag=true;e.preventDefault();}});
document.addEventListener('mousemove',e=>{
  if(!wpDrag) return;
  const ar=app.getBoundingClientRect();
  S.ui.panelWidth=Math.round(Math.min(720,Math.max(244,ar.right-e.clientX)));
  const p=document.getElementById('work-panel'); if(p&&!p.classList.contains('overlay')) p.style.width=S.ui.panelWidth+'px';
});
document.addEventListener('mouseup',()=>{wpDrag=false;});
/* 侧栏拖拽（实时写回 appearance.sidebarWidth，范围对齐设置项 200–400） */
let sbDrag=false;
document.addEventListener('mousedown',e=>{if(e.target.id==='sb-resize'){sbDrag=true;e.preventDefault();}});
document.addEventListener('mousemove',e=>{
  if(!sbDrag) return;
  const ar=app.getBoundingClientRect();
  S.settings.appearance.sidebarWidth=Math.round(Math.min(400,Math.max(200,e.clientX-ar.left)));
  const sb=document.getElementById('sidebar'); if(sb) sb.style.width=S.settings.appearance.sidebarWidth+'px';
});
document.addEventListener('mouseup',()=>{sbDrag=false;});

/* ═══ 窗口尺寸 / 演示控制 ═══ */
function fitWindow(){
  const vw=innerWidth,vh=innerHeight;
  const w=Math.min(S.ui.winW,vw),h=Math.min(S.ui.winH,vh);
  app.style.width=w+'px'; app.style.height=h+'px';
  if(w<vw-4||h<vh-4){app.style.border='1px solid var(--borderSubtle)';app.style.borderRadius='10px';app.style.boxShadow='0 24px 80px rgba(0,0,0,.6)';}
  else{app.style.border='none';app.style.borderRadius='0';app.style.boxShadow='none';}
  if(w>=NARROW_BP) S.ui.drawerOpen=false;
}
addEventListener('resize',()=>{fitWindow();render();});
document.getElementById('demo').addEventListener('click',e=>{
  const b=e.target.closest('[data-demo]'); if(!b) return;
  const k=b.dataset.demo;
  if(k==='bell'){
    const t=S.threads.find(x=>x.kind==='terminal'&&x.status==='running'&&!(S.route?.type==='thread'&&S.route.id===x.id));
    if(t){t.hasBell=true;pushNotice('warn',`「${rowTitle(t)}」等待注意`,(wsById(t.workspaceId)?.name??'未归属')+' · BEL');
      if(S.settings.notifications.desktop)toast(`🔔 ${rowTitle(t)} 等待注意`);render();}
    else toast('没有可打 BEL 的后台终端（先切走一个终端会话）');
  }
  else if(k==='notice'){pushNotice('ok','构建完成：jagent-terminal','cargo build · 42s');render();}
  else if(k==='error'){S.errors.push({level:'error',area:'native',message:'PTY write failed: EPIPE (demo)',at:Date.now()});render();}
  else if(k==='crash'){S.ui.dialog={kind:'crash'};render();}
  else if(k==='font'){S.route={type:'settings'};S.ui.settingsSection='terminal';render();
    setTimeout(()=>app.querySelector('[data-act="font-open"]')?.click(),0);}
  else if(k==='reset'){S=seedState();Object.keys(termCache).forEach(k=>delete termCache[k]);fitWindow();render();}
  else if(k.startsWith('w')){S.ui.winW=Number(k.slice(1));fitWindow();render();}
});

/* ═══ 启动（支持 ?view= 深链截图/演示）═══ */
const _render=render;
render=function(){_render();mountTerminals();
  const cl=document.getElementById('conv-msgs'); if(cl) cl.scrollTop=cl.scrollHeight;
};
(function bootView(){
  const v=new URLSearchParams(location.search).get('view');
  if(!v) return;
  if(v==='home') S.route=null;
  else if(v==='settings') S.route={type:'settings'};
  else if(v==='font'){S.route={type:'settings'};S.ui.settingsSection='terminal';
    setTimeout(()=>{app.querySelector('[data-act="font-open"]')?.click();
      const q=new URLSearchParams(location.search).get('q');
      if(q&&S.ui.fontPicker){S.ui.fontPicker.q=q;render();app.querySelector('[data-fontq]')?.focus();}},0);}
  else if(v==='git'){S.workspaces[0].paneTab='git';S.route={type:'workspace',id:'ws-jt'};}
  else if(v==='workspace') S.route={type:'workspace',id:'ws-web'};
  else if(v==='chat') S.route={type:'thread',id:'t-sidebar'};
  else if(v==='acp') S.route={type:'thread',id:'t-acp'};
  else if(v==='panel'){S.ui.panelOpen=true;S.worktree.selected='packages/app/src/plane/Sidebar.tsx';}
  else if(v==='search') S.ui.dialog={kind:'search'};
  else if(v==='tool') S.ui.dialog={kind:'tool',workspaceId:'ws-jt'},S.ui.toolWs='ws-jt';
  else if(v==='addws') S.ui.dialog={kind:'addWorkspace'};
  else if(v==='errors') S.ui.dialog={kind:'errors'};
  else if(v==='crash') S.ui.dialog={kind:'crash',last:{}};
  else if(v==='notif') S.ui.notifOpen=true;
  else if(v==='ctxmenu') S.ui.ctxMenu={kind:'thread',id:'t-ime',x:60,y:300,items:threadMenuItems(threadById('t-ime'))};
  else if(v==='narrow') S.ui.winW=700;
  else if(v==='hidden') S.ui.sidebarHidden=true;
})();
fitWindow();
render();
</script>
</body>
