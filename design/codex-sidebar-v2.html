<!doctype html>
<!-- design/codex-sidebar-v2.html — Codex 侧栏裁剪方案 C（折中）：nav 行组 + 工作区分组 + priority 排序 + pin/unread + 右键菜单。
     配色沿用 --g* token。无归属会话归入「未归属」项目组。 -->
<html lang="zh">
<head>
<meta charset="utf-8"><title>sidebar · codex 方案 C</title>
<style>
  :root{
    --g0:#fff; --g100:#ededed; --g300:#afafaf; --g550:#4f4f4f;
    --g700:#303030; --g750:#282828; --g800:#212121; --g900:#181818; --g1000:#0d0d0d;
    --bg:var(--g900);
    --hover:color-mix(in oklab,var(--g0) 6%,transparent);
    --active:color-mix(in oklab,var(--g0) 10%,transparent);
    --cur:color-mix(in oklab,var(--g0) 4%,transparent);
    --t1:var(--g0); --t2:color-mix(in oklab,var(--g0) 70%,transparent);
    --t3:color-mix(in oklab,var(--g0) 52%,transparent); --t4:color-mix(in oklab,var(--g0) 40%,transparent);
    --bd:color-mix(in oklab,var(--g0) 8%,transparent);
    --ok:#4caf7d; --run:#e8a34c; --need:#b48ce8; --err:#e05c5c;
    --ui:13px -apple-system,"SF Pro Text",sans-serif;
    --mono:11px ui-monospace,Menlo,monospace;
    --w:264px;
    --r-ctl:5px; --r-nav:6px; --r-dlg:10px;
    --focus:color-mix(in oklab,var(--g0) 45%,transparent);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{display:flex;background:var(--g1000);color:var(--t2);font:var(--ui);
       -webkit-user-select:none;user-select:none}
  svg{display:block;flex:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
  :focus{outline:none}
  :focus-visible{outline-width:1.5px;outline-style:solid;outline-color:var(--focus);outline-offset:-1.5px;border-radius:var(--r-ctl)}

  .sb{width:var(--w);flex:none;display:flex;flex-direction:column;height:100vh;
      background:var(--bg);border-right:1px solid var(--bd)}

  .head{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px 0 78px}
  .ib{width:28px;height:28px;border-radius:var(--r-nav);display:flex;align-items:center;
      justify-content:center;color:var(--t3)}
  .ib:hover{background:var(--hover);color:var(--t1)}

  /* nav 行组（Codex：全宽文字行） */
  .nav{display:flex;align-items:center;gap:8px;height:30px;margin:0 8px;width:calc(100% - 16px);
       padding:0 8px;border-radius:var(--r-nav);color:var(--t2);font:var(--ui)}
  .nav:hover{background:var(--hover);color:var(--t1)}
  .nav .ico{width:16px;display:flex;align-items:center;justify-content:center;flex:none}

  /* 区头 */
  .sec{display:flex;align-items:center;height:26px;margin:8px 8px 0;
       padding:0 6px 0 8px;color:var(--t3);font:500 12px/1 var(--ui)}
  .sec .grow{flex:1}
  .gh{width:22px;height:22px;border-radius:var(--r-ctl);display:flex;align-items:center;
      justify-content:center;color:var(--t3);opacity:0}
  .sec:hover .gh,.ws-head:hover .gh,.row:hover .gh,.gh:focus-visible{opacity:1}
  .gh:hover{background:var(--hover);color:var(--t1)}

  .scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:8px;scrollbar-width:thin;
          scrollbar-color:transparent transparent}
  .scroll:hover{scrollbar-color:color-mix(in oklab,var(--g0) 20%,transparent) transparent}

  /* 会话行 */
  .row{position:relative;display:flex;align-items:center;height:28px;margin:0 8px;width:calc(100% - 16px);
       padding:0 4px;border-radius:var(--r-nav);color:var(--t2)}
  .row:hover{background:var(--hover)}
  .row.on{background:var(--active);color:var(--t1)}
  .row.unread .ttl{color:var(--t1);font-weight:560}
  .stt{width:18px;flex:none;display:flex;justify-content:center;align-items:center}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.run{background:var(--run);box-shadow:0 0 0 3px color-mix(in oklab,var(--run) 15%,transparent)}
  .dot.need{background:var(--need);box-shadow:0 0 0 3px color-mix(in oklab,var(--need) 15%,transparent)}
  .dot.unr{background:var(--t3)}
  .dot.idle{width:9px;height:9px;background:none;border:1.5px solid var(--g300)}
  .ttl{flex:1;min-width:0;margin:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .acts{display:flex;gap:2px;width:22px;flex:none;align-items:center}
  .pin{color:var(--t4);flex:none;margin-right:2px;display:flex;align-items:center}
  .more{display:flex;align-items:center;height:26px;margin:0 8px;width:calc(100% - 16px);
        padding:0 8px 0 20px;border-radius:var(--r-nav);color:var(--t3);font-size:11px}
  .more:hover{background:var(--hover)}

  /* 项目行 */
  .ws-head{display:flex;align-items:center;height:28px;margin:0 8px;padding:0 2px;border-radius:var(--r-nav)}
  .ws-head:hover{background:var(--hover)}
  .ws-head.cur{background:var(--cur)}
  .ws-head.cur:hover{background:var(--cur)}
  .ws-name{flex:1;min-width:0;display:flex;align-items:center;gap:5px;height:26px;
           padding:0 6px;border-radius:var(--r-nav);color:var(--t2)}
  .ws-name .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
               font-weight:500}
  .chev{width:16px;flex:none;color:var(--t4);display:flex;align-items:center;justify-content:center;
        height:26px;border-radius:var(--r-ctl)}
  .chev:hover{background:var(--hover);color:var(--t1)}
  .ws-head.cur .chev{color:var(--t3)}
  .ws-body{margin-left:17px;margin-right:8px;padding-left:8px;border-left:1px solid color-mix(in oklab,var(--g0) 6%,transparent);
           display:flex;flex-direction:column}
  .ws-body .row{margin:0;width:100%}
  .ws-body .more{margin:0;width:100%;padding-left:20px}
  .empty{height:22px;display:flex;align-items:center;padding:0 8px;color:var(--t4);font-size:11px}
  /* 当前工作区 5px 状态点 */
  .cur-dot{flex:none;width:5px;height:5px;border-radius:50%;background:var(--g300)}

  .foot{flex:none;display:flex;align-items:center;gap:2px;padding:8px 10px 12px;border-top:1px solid var(--bd)}
  .foot .ib{position:relative}
  .foot .unr-dot{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;
    background:var(--err);border:1.5px solid var(--bg)}
  .ver{margin-left:auto;font-size:11px;color:var(--t4)}

  /* 上下文菜单 */
  .ctx{position:fixed;z-index:50;min-width:200px;padding:4px;background:var(--g800);
       border:1px solid var(--bd);border-radius:var(--r-dlg);
       box-shadow:0 12px 36px rgba(0,0,0,.5);display:none}
  .ctx.open{display:block}
  .ci{display:flex;align-items:center;gap:8px;height:26px;width:100%;padding:0 8px;border-radius:var(--r-ctl);
      color:var(--t2);font-size:12px}
  .ci:hover,.ci.hl{background:var(--hover);color:var(--t1)}
  .ci .k{margin-left:auto;font:var(--mono);color:var(--t4)}
  .ci.sep{height:1px;background:var(--bd);margin:4px 6px;padding:0;cursor:default}
  .ci.danger:hover,.ci.danger.hl{color:var(--err)}

  .main{flex:1;display:flex;align-items:center;justify-content:center;color:var(--t4);
    flex-direction:column;gap:8px}
  .main .hint{font-size:11px;color:var(--t4);opacity:.7}

  /* rename 弹窗 */
  dialog.ren-dlg{background:var(--g800);border:1px solid var(--bd);border-radius:var(--r-dlg);
    box-shadow:0 12px 36px rgba(0,0,0,.5);padding:16px;width:280px;color:var(--t2);
    font:var(--ui);position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);margin:0}
  dialog.ren-dlg::backdrop{background:rgba(0,0,0,.3)}
  .ren-dlg h3{font-size:13px;font-weight:560;color:var(--t1);margin:0 0 10px}
  .ren-dlg input{width:100%;height:28px;font-size:13px;font-family:inherit;color:var(--t1);
    background:var(--g750);border:1px solid color-mix(in oklab,var(--g0) 28%,transparent);
    border-radius:var(--r-ctl);padding:0 8px;outline:none}
  .ren-dlg input:focus-visible{outline-width:1.5px;outline-style:solid;outline-color:var(--focus);outline-offset:-1.5px}
  .ren-dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
  .ren-dlg .btn{height:26px;padding:0 12px;border-radius:var(--r-ctl);font-size:12px;
    display:flex;align-items:center;cursor:pointer}
  .ren-dlg .btn.pri{background:var(--g0);color:var(--g1000);font-weight:500}
  .ren-dlg .btn.sec{background:var(--hover);color:var(--t2)}
  .ren-dlg .btn.sec:hover{color:var(--t1)}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.65"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 7 3 3v2H7v-2l3-3-1-7z" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/><path d="M12 16v5" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.65"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/></symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M10.3 21a1.9 1.9 0 0 0 3.4 0" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<aside class="sb" id="sb">
  <div class="head">
    <button class="ib" id="collapse" title="收起侧栏 (⌘B)" aria-label="收起侧栏">
      <svg width="16" height="16"><use href="#i-collapse"/></svg>
    </button>
  </div>
  <div class="scroll" id="scroll"></div>
  <div class="foot">
    <button class="ib" title="设置" aria-label="设置"><svg width="15" height="15"><use href="#i-gear"/></svg></button>
    <button class="ib" title="通知" aria-label="通知"><svg width="15" height="15"><use href="#i-bell"/></svg>
      <span class="unr-dot" id="notifDot"></span></button>
    <span class="ver">v0.1</span>
  </div>
</aside>
<main class="main">
  <div>（右侧内容区占位）</div>
  <div class="hint">方案 C：nav 行 + 工作区分组 + priority 排序 + pin/unread + 右键菜单。⌘B 整列隐藏。</div>
</main>
<div class="ctx" id="ctx" role="menu" aria-hidden="true"></div>

<dialog class="ren-dlg" id="renDlg">
  <h3 id="renTitle">Rename</h3>
  <input id="renInput" aria-label="新名称">
  <div class="btns">
    <button class="btn sec" id="renCancel">Cancel</button>
    <button class="btn pri" id="renOk">Rename</button>
  </div>
</dialog>

<script>
// ── 数据模型：priority 排序 = pin > run > queue > unread > recency ──
const PRIO = { run: 0, queue: 1, unread: 2, idle: 3 }
let seq = 0
const T = (title, ws, st = 'idle', extra = {}) => {
  const n = ++seq
  return { id: 't' + n, n, title, ws, st, unread: false, pin: false, ...extra }
}
const WS = (name, threads) => ({ id: 'w' + (++seq), name, open: true, pin: false, threads })
const state = {
  projects: [
    WS('jagent-terminal', [
      T('终端接入 IME', null, 'run'),
      T('侧栏重构', null, 'idle', { unread: true, pin: true }),
      T('IME 候选窗定位', null),
      T('titlebar 红绿灯让位', null),
      T('导出 patch 流程', null),
      T('会话 6', null),
    ]),
    WS('dotfiles', [T('同步 nvim 配置', null, 'queue')]),
    // 未归属 = 无工作区的临时会话组
    WS('未归属', [
      T('修复登录鉴权回退', null, 'run'),
      T('重构 parser 状态机', null, 'idle', { unread: true }),
      T('调研 Metal 渲染管线', null),
      T('写 release notes', null),
      T('Bump gpuix 依赖', null),
      T('旧会话 6', null),
      T('旧会话 7', null),
    ]),
    WS('web', []),
  ],
  active: null, showAllWs: {}, focusTid: null,
  sidebarHidden: false,
  notices: 2,
}
state.projects.forEach(p => p.threads.forEach(t => t.ws = p.id))

const $ = s => document.querySelector(s)
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const allThreads = () => state.projects.flatMap(p => p.threads)
const effP = t => t.st === 'idle' && t.unread ? PRIO.unread : PRIO[t.st]
const ICON = (id, s = 12) => `<svg width="${s}" height="${s}" aria-hidden="true"><use href="#${id}"/></svg>`

// priority 排序：pin > run > queue > unread > recency
const sortTs = a => [...a].sort((x, y) =>
  (y.pin - x.pin) || (effP(x) - effP(y)) || (y.n - x.n))

const WS_LIMIT = 4

function dot(t) {
  if (t.st === 'run') return '<i class="dot run" aria-label="运行中"></i>'
  if (t.st === 'queue') return '<i class="dot need" aria-label="等待确认"></i>'
  if (t.unread) return '<i class="dot unr" aria-label="未读"></i>'
  return state.active === t.id ? '<i class="dot idle" aria-hidden="true"></i>' : ''
}
function row(t) {
  return `<div class="row ${state.active === t.id ? 'on' : ''} ${t.unread ? 'unread' : ''}"
    data-tid="${t.id}" tabindex="-1" role="button"
    ${state.active === t.id ? 'aria-current="true"' : ''}
    aria-label="${esc(t.title)}${t.unread ? '，未读' : ''}${t.st === 'run' ? '，运行中' : ''}${t.st === 'queue' ? '，等待确认' : ''}">
    <span class="stt">${dot(t)}</span>
    ${t.pin ? `<span class="pin" title="已置顶">${ICON('i-pin', 10)}</span>` : ''}
    <span class="ttl">${esc(t.title)}</span>
    <span class="acts"><button class="gh" data-menu="${t.id}" title="更多操作" aria-label="更多操作" tabindex="-1">${ICON('i-more')}</button></span>
  </div>`
}
const curWs = () => { const t = allThreads().find(t => t.id === state.active); return t ? t.ws : null }

function render() {
  const hadFocus = document.activeElement?.closest?.('[data-tid]')
  if (hadFocus) state.focusTid = hadFocus.dataset.tid
  const keepId = state.active ?? state.focusTid

  let html = ''
  // nav 行组
  html += `<button class="nav" data-act="new"><span class="ico">${ICON('i-plus', 14)}</span><span class="lbl">New chat</span></button>
           <button class="nav" data-act="search"><span class="ico">${ICON('i-search', 14)}</span><span class="lbl">Search</span></button>`

  // 工作区
  html += `<div class="sec">工作区<span class="grow"></span>
    <button class="gh" title="添加工作区" aria-label="添加工作区">${ICON('i-plus')}</button></div>
    <div class="tree" id="projects">`
  html += [...state.projects].sort((a, b) => b.pin - a.pin).map(p => {
    const ts = sortTs(p.threads)
    const showAll = !!state.showAllWs[p.id]
    let plim = showAll ? ts.length : WS_LIMIT
    // active/focus 行不被截断
    if (keepId) {
      const ix = ts.findIndex(t => t.id === keepId); if (ix >= plim) plim = ix + 1
    }
    const vis = ts.slice(0, plim)
    let body
    if (!ts.length) body = '<div class="empty">No threads</div>'
    else {
      body = vis.map(row).join('')
      if (ts.length > plim) body += `<button class="more" data-more="${p.id}">${showAll ? 'Show less' : `Show more (${ts.length - plim})`}</button>`
      else if (showAll && ts.length > WS_LIMIT) body += `<button class="more" data-more="${p.id}">Show less</button>`
    }
    return `<div class="ws">
      <div class="ws-head ${curWs() === p.id ? 'cur' : ''}">
        <button class="chev" data-fold="${p.id}" aria-expanded="${p.open}" aria-label="${p.open ? '折叠' : '展开'} ${esc(p.name)}"
          style="${p.open ? '' : 'transform:rotate(-90deg)'}">${ICON('i-chev', 10)}</button>
        <button class="ws-name" data-ws="${p.id}" aria-current="${curWs() === p.id ? 'true' : 'false'}">${ICON('i-folder', 12)}
          <span class="nm">${esc(p.name)}</span>
          ${curWs() === p.id ? '<span class="cur-dot"></span>' : ''}</button>
        <button class="gh" data-wsmenu="${p.id}" title="项目菜单" aria-label="项目菜单" tabindex="-1">${ICON('i-more')}</button>
        <button class="gh" data-newin="${p.id}" title="新建会话" aria-label="新建会话" tabindex="-1">${ICON('i-plus')}</button>
      </div>
      ${p.open ? `<div class="ws-body">${body}</div>` : ''}
    </div>`
  }).join('')
  html += '</div>'
  $('#scroll').innerHTML = html

  $('#notifDot').style.display = state.notices ? '' : 'none'
}

// ── 上下文菜单（右键 / … 同一面，role=menu + ↑↓ 导航 + Esc 焦点恢复）──
const ctx = $('#ctx'); let ctxFor = null, ctxTrigger = null, ctxHl = -1
function openCtx(x, y, items) {
  ctx._items = items
  ctx.innerHTML = items.map((i, ix) => i === '-' ? '<div class="ci sep" role="separator"></div>' :
    `<div class="ci ${i.d ? 'danger' : ''}" role="menuitem" data-ix="${ix}" tabindex="-1">${i.l}${i.k ? `<span class="k">${i.k}</span>` : ''}</div>`).join('')
  ctx.style.left = Math.min(x, innerWidth - 220) + 'px'
  ctx.style.top = Math.min(y, innerHeight - items.length * 27 - 12) + 'px'
  ctx.classList.add('open'); ctx.setAttribute('aria-hidden', 'false')
  ctxHl = -1; hl(1)
}
const closeCtx = () => {
  ctx.classList.remove('open'); ctx.setAttribute('aria-hidden', 'true'); ctxHl = -1
  if (ctxTrigger) { ctxTrigger.focus && ctxTrigger.focus(); ctxTrigger = null }
}
function hl(dir) {
  const its = [...ctx.querySelectorAll('.ci:not(.sep)')]; if (!its.length) return
  ctxHl = ((ctxHl + dir) % its.length + its.length) % its.length
  its.forEach((el, i) => el.classList.toggle('hl', i === ctxHl))
}
function threadMenu(t, x, y, trig) {
  ctxFor = t; ctxTrigger = trig
  openCtx(x, y, [
    { c: 'pin', l: t.pin ? 'Unpin' : 'Pin' },
    { c: 'ren', l: 'Rename…' },
    { c: 'unread', l: t.unread ? 'Mark as read' : 'Mark as unread' }, '-',
    { c: 'rm', l: 'Remove', d: 1 }])
}
function projectMenu(p, x, y, trig) {
  ctxFor = p; ctxTrigger = trig
  openCtx(x, y, [
    { c: 'p-pin', l: p.pin ? 'Unpin project' : 'Pin project' },
    { c: 'p-ren', l: 'Rename…' }, '-',
    { c: 'p-rm', l: 'Remove project', d: 1 }])
}
function runCmd(c) {
  if (!ctxFor) return
  const needRename = c === 'ren' || c === 'p-ren'
  if (c === 'pin') ctxFor.pin = !ctxFor.pin
  if (c === 'unread') ctxFor.unread = !ctxFor.unread
  if (c === 'rm' || c === 'p-rm') {
    if (c === 'rm') {
      const wasActive = state.active === ctxFor.id
      for (const p of state.projects) p.threads = p.threads.filter(t => t !== ctxFor)
      if (wasActive) { const next = sortTs(allThreads())[0]; state.active = next?.id ?? null; state.focusTid = state.active }
      if (state.focusTid === ctxFor.id) state.focusTid = null
    } else state.projects = state.projects.filter(p => p !== ctxFor)
  }
  if (c === 'p-pin') ctxFor.pin = !ctxFor.pin
  render()
  if (needRename) startRename(ctxFor)
}
ctx.addEventListener('click', e => {
  const el = e.target.closest('.ci'); if (!el) return
  const it = ctx._items[+el.dataset.ix]; closeCtx(); if (it && it.c) runCmd(it.c)
})
ctx.addEventListener('mousemove', e => {
  const el = e.target.closest('.ci:not(.sep)'); if (!el) return
  const its = [...ctx.querySelectorAll('.ci:not(.sep)')]
  ctxHl = its.indexOf(el); its.forEach((x, i) => x.classList.toggle('hl', i === ctxHl))
})

// rename 弹窗
const renDlg = $('#renDlg'), renInput = $('#renInput'), renTitle = $('#renTitle')
let renTarget = null
function startRename(t) {
  renTarget = t
  renTitle.textContent = t.title !== undefined ? 'Rename thread' : 'Rename project'
  renInput.value = t.title !== undefined ? t.title : t.name
  renDlg.showModal()
  requestAnimationFrame(() => { renInput.focus(); renInput.select() })
}
function commitRename() {
  if (renTarget && renInput.value.trim()) {
    if (renTarget.title !== undefined) renTarget.title = renInput.value.trim()
    else renTarget.name = renInput.value.trim()
  }
  renDlg.close(); renTarget = null; render()
}
$('#renOk').onclick = commitRename
$('#renCancel').onclick = () => { renDlg.close(); renTarget = null }
renInput.onkeydown = e => {
  if (e.key === 'Enter') { e.preventDefault(); commitRename() }
  if (e.key === 'Escape') { renTarget = null } e.stopPropagation()
}
renDlg.addEventListener('close', () => { renTarget = null })
renDlg.addEventListener('click', e => { if (e.target === renDlg) { renDlg.close(); renTarget = null } })

// ── 事件 ──
document.addEventListener('click', e => {
  if (ctx.classList.contains('open') && !ctx.contains(e.target)) closeCtx()
  const g = e.target.closest('.gh'); if (g) {
    e.stopPropagation()
    if (g.dataset.menu) threadMenu(allThreads().find(t => t.id === g.dataset.menu), e.clientX, e.clientY, g)
    else if (g.dataset.wsmenu) projectMenu(state.projects.find(p => p.id === g.dataset.wsmenu), e.clientX, e.clientY, g)
    else if (g.dataset.newin) { const p = state.projects.find(p => p.id === g.dataset.newin); p.threads.unshift(T('新会话', p.id)); p.open = true; render() }
    return
  }
  const m = e.target.closest('[data-more]'); if (m) {
    state.showAllWs[m.dataset.more] = !state.showAllWs[m.dataset.more]
    render(); return
  }
  const f = e.target.closest('[data-fold]'); if (f) {
    e.stopPropagation()
    const p = state.projects.find(p => p.id === f.dataset.fold); p.open = !p.open; render(); return
  }
  const w = e.target.closest('[data-ws]'); if (w) {
    const p = state.projects.find(p => p.id === w.dataset.ws)
    p.open = true
    const ts = sortTs(p.threads); if (ts[0]) state.active = ts[0].id
    render(); return
  }
  const r = e.target.closest('[data-tid]'); if (r) {
    const t = allThreads().find(t => t.id === r.dataset.tid)
    state.active = r.dataset.tid; state.focusTid = r.dataset.tid
    if (t) t.unread = false
    render(); return
  }
  const n = e.target.closest('[data-act]'); if (n) {
    if (n.dataset.act === 'new') {
      let un = state.projects.find(p => p.name === '未归属')
      if (!un) { un = WS('未归属', []); state.projects.push(un) }
      un.threads.unshift(T('新会话', un.id)); un.open = true; render()
    }
    // search：原型占位（正式实现 = ⌘K SearchDialog）
  }
})
document.addEventListener('contextmenu', e => {
  const r = e.target.closest('[data-tid]'), w = e.target.closest('.ws-head')
  if (r) { e.preventDefault(); threadMenu(allThreads().find(t => t.id === r.dataset.tid), e.clientX, e.clientY, r) }
  else if (w) {
    e.preventDefault()
    const p = state.projects.find(p => p.id === w.querySelector('[data-ws]').dataset.ws)
    projectMenu(p, e.clientX, e.clientY, w.querySelector('[data-ws]'))
  }
})
document.addEventListener('keydown', e => {
  if (ctx.classList.contains('open')) {
    if (e.key === 'Escape') { e.preventDefault(); closeCtx(); return }
    if (e.key === 'ArrowDown') { e.preventDefault(); hl(1); return }
    if (e.key === 'ArrowUp') { e.preventDefault(); hl(-1); return }
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault()
      const its = [...ctx.querySelectorAll('.ci:not(.sep)')]
      const el = its[ctxHl]; if (el) { const it = ctx._items[+el.dataset.ix]; closeCtx(); if (it && it.c) runCmd(it.c) }
      return
    }
    return
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'b') { e.preventDefault(); toggleSidebar(); return }
  if (e.key === 'Escape') closeCtx()
  const ae = document.activeElement
  const row = (ae && ae.closest) ? ae.closest('[data-tid]') : (e.target.closest ? e.target.closest('[data-tid]') : null)
  if (row && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault()
    state.active = row.dataset.tid
    const t = allThreads().find(t => t.id === state.active); if (t) t.unread = false; render()
  }
})
function toggleSidebar() {
  state.sidebarHidden = !state.sidebarHidden
  $('#sb').style.display = state.sidebarHidden ? 'none' : ''
}
$('#collapse').onclick = toggleSidebar

render()
</script>
</body>
</html>
