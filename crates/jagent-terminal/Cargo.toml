[package]
name = "jagent-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal session pool + emulator for j-agent (gpui + alacritty_terminal)"

[lib]
# Vendored gpui-terminal files keep their upstream doc examples, which
# reference the `gpui_terminal` crate name. Same call Zed makes for gpui.
doctest = false

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
alacritty_terminal = "0.26"
anyhow = "1"
futures = "0.3"
# 结构化错误：稳定错误码（ERR_TERMINAL_*）。
thiserror = "2.0.20"

# 示例在运行时设置 DPI 感知，而不是随 exe 附带 manifest。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_HiDpi"] }

[[example]]
name = "window"
path = "examples/window.rs"
