[package]
name = "jagent-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal session pool + emulator for j-agent (gpui + alacritty_terminal)"

[lib]
# Vendored gpui-terminal files keep their upstream doc examples, which
# reference the `gpui_terminal` crate name. Same call Zed makes for gpui.
doctest = false

[dependencies]
# GPUI fork pinned by gpuix (remorses/zed @gpuix branch, rev 8b94def).
# Same configuration as gpuix-native desktop target so the napi shell in
# Phase 1 can link both without feature conflicts.
gpui = { path = "../../.refs/gpuix/zed/crates/gpui", default-features = false, features = [
    "font-kit",
    "wayland",
    "x11",
] }
gpui_platform = { path = "../../.refs/gpuix/zed/crates/gpui_platform", default-features = false, features = [
    "font-kit",
] }
alacritty_terminal = "0.26"
anyhow = "1"
futures = "0.3"

# Same crate GPUI uses. The example sets DPI awareness at runtime instead of
# shipping an exe manifest (mirrors gpuix-native).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_HiDpi"] }

[dev-dependencies]

[[example]]
name = "window"
path = "examples/window.rs"
