[package]
name = "jagent-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "j-agent desktop app: gpui views, actions, theme, window"

[[bin]]
name = "j-agent"
path = "src/main.rs"

[dependencies]
jagent-core = { path = "../jagent-core" }
jagent-terminal = { path = "../jagent-terminal" }
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-base.workspace = true
serde_json = "1"
futures = "0.3"

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
tempfile = "3"

[[test]]
name = "shell_shot"
harness = false

[[test]]
name = "nested_scroll"
path = "tests/nested_scroll.rs"
harness = false

[[test]]
name = "terminal_settings"
path = "tests/terminal_settings.rs"
harness = false
