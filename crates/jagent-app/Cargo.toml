[package]
name = "jagent-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "j-agent desktop app: gpui views, actions, theme, window"

[[bin]]
name = "j-agent"
path = "src/main.rs"

[dependencies]
jagent-core = { path = "../jagent-core" }
jagent-terminal = { path = "../jagent-terminal" }
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-base.workspace = true
serde_json = "1"
futures = "0.3"
# 只为本地时区偏移（git 图相对时间的「昨天」日历日）；0.4 线与 gpui-component
# 传递依赖同一份（0.4.45，crates.io 最新正式版，联网核实过），不引入第二份 chrono。
chrono = "0.4"

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
tempfile = "3"

[[test]]
name = "shell_shot"
harness = false

[[test]]
name = "v_shots"
harness = false

[[test]]
name = "nested_scroll"
path = "tests/nested_scroll.rs"
harness = false

[[test]]
name = "terminal_settings"
path = "tests/terminal_settings.rs"
harness = false
